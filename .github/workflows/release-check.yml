# Manual gate before creating an immutable release tag.
# Does not create tags. Confirms the candidate SHA already has a completed
# platform-ci run with success (cancelled-in-progress does not qualify).
name: release-check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Candidate commit SHA (must already have green platform-ci)
        required: true
        type: string

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require completed successful platform-ci on SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          SHA="$(gh api "repos/${{ github.repository }}/commits/${CANDIDATE}" --jq .sha)"
          echo "candidate=${SHA}"
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=completed&per_page=30" \
            --jq '[.workflow_runs[] | select(.name=="platform-ci") | .conclusion] | .[0] // "missing"')"
          echo "platform-ci conclusion=${conclusion}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Refuse release: platform-ci conclusion is '${conclusion}' (need success on this exact SHA). Cancelled runs do not qualify."
            exit 1
          fi
          echo "OK: platform-ci succeeded on ${SHA} — safe to create an immutable tag pointing here."
