kind: ScheduledJob

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

schedule:
  expression: ""
  # Required in the public manifesto (application semantics). No silent platform default.
  timeZone: ""
  concurrencyPolicy: Forbid
  # Optional: how late an occurrence may still start. No platform default.
  startingDeadlineSeconds: null

execution:
  # Required: maps to Job activeDeadlineSeconds (Forbid + stuck job otherwise blocks forever).
  timeoutSeconds: null
  retries: 2
  command: []
  args: []

history:
  successful: 3
  failed: 1

# Platform always creates SA named after the release. Public: annotations only.
serviceAccount:
  annotations: {}

workloadIdentity:
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    mountPath: /var/run/secrets/gcp/serviceaccount
    defaultMode: 420
  gcp:
    audience: ""
    serviceAccountEmail: ""
    projectId: ""

config: {}

externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

# Platform-owned security baseline (not in public manifesto schema).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
