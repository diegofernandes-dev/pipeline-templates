kind: ScheduledJob

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

schedule:
  expression: ""
  # Required in the public manifesto (application semantics). No silent platform default.
  timeZone: ""
  concurrencyPolicy: Forbid
  # Optional: how late an occurrence may still start. No platform default.
  startingDeadlineSeconds: null

execution:
  # Required: maps to Job activeDeadlineSeconds (Forbid + stuck job otherwise blocks forever).
  timeoutSeconds: null
  retries: 2
  command: []
  args: []

history:
  successful: 3
  failed: 1

# Platform always creates SA named after the release. Public: annotations only.
serviceAccount:
  annotations: {}

workloadIdentity:
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    mountPath: /var/run/secrets/gcp/serviceaccount
    defaultMode: 420
  gcp:
    audience: ""
    serviceAccountEmail: ""
    projectId: ""

config: {}

# Writable scratch for readOnlyRootFilesystem pods. Platform-owned (not in public manifesto).
tmp:
  sizeLimit: 128Mi

externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

# Platform-owned security baseline (not in public manifesto schema).
podSecurityContext:
  runAsNonRoot: true
  # 1654 = APP_UID in mcr.microsoft.com/dotnet/aspnet (verified for 8.0, 9.0, 10.0).
  # docker/dotnet/Dockerfile asserts this at build time — see asa-application/values.yaml.
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
