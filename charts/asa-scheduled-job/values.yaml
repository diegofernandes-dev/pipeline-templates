kind: ScheduledJob

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

schedule:
  expression: ""
  # Required in the public manifesto (application semantics). No silent platform default.
  timeZone: ""
  concurrencyPolicy: Forbid
  # Optional: how late an occurrence may still start. No platform default.
  startingDeadlineSeconds: null

execution:
  # Required: maps to Job activeDeadlineSeconds (Forbid + stuck job otherwise blocks forever).
  timeoutSeconds: null
  retries: 2
  command: []
  args: []

history:
  successful: 3
  failed: 1

# Platform always creates SA named after the release. Public: annotations only.
serviceAccount:
  annotations: {}

workloadIdentity:
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    mountPath: /var/run/secrets/gcp/serviceaccount
    defaultMode: 420
  gcp:
    audience: ""
    serviceAccountEmail: ""
    projectId: ""

# Free-form string map → ConfigMap. Reserved: PORT, APP_PROTOCOL, SHUTDOWN_TIMEOUT_SECONDS,
# CPU_REQUEST_MILLICORES, GOOGLE_APPLICATION_CREDENTIALS. Runtime-specific keys are guarded
# by platform/runtimes/<runtime>.yml via the pipeline.
config: {}

# Writable scratch for readOnlyRootFilesystem pods. Platform-owned (not in public manifesto).
tmp:
  sizeLimit: 128Mi

externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

# Window between SIGTERM and SIGKILL. A CronJob pod is not rolled out, so minReadySeconds has
# no meaning here, but the pod still receives SIGTERM when its Job is deleted or the deadline
# hits. Must stay strictly above shutdownTimeoutSeconds.
terminationGracePeriodSeconds: 30

# Exposed as SHUTDOWN_TIMEOUT_SECONDS; the image entrypoint maps it to the runtime clock.
shutdownTimeoutSeconds: 25

# Platform-owned security baseline (not in public manifesto schema).
podSecurityContext:
  runAsNonRoot: true
  # Platform UID — every docker/<runtime>/ image must create or assert this UID.
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Label-only environment name. Injected by resolve-platform-values.sh with platform.*.
runtime:
  environment: ""

# Resolved by scripts/resolve-platform-values.sh (area/tier labels; gateway fields unused by CronJob).
platform:
  area: ""
  tier: ""
  gatewayName: ""
  gatewayNamespace: ""
  dnsZone: ""
  legacyDnsZone: ""
  defaultMinReplicas: 1
