{{- include "chart.validateScheduledJob" . }}
{{- include "chart.validateWorkloadIdentity" . }}
{{- include "chart.validateExternalSecret" . }}
{{- $sched := .Values.schedule -}}
{{- $ex := .Values.execution | default dict -}}
{{- $hist := .Values.history | default dict -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: scheduled-job
spec:
  schedule: {{ $sched.expression | quote }}
  timeZone: {{ $sched.timeZone | default "America/Sao_Paulo" | quote }}
  concurrencyPolicy: {{ $sched.concurrencyPolicy | default "Forbid" }}
  {{- if kindIs "float64" $sched.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ $sched.startingDeadlineSeconds | int }}
  {{- else if kindIs "int" $sched.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ $sched.startingDeadlineSeconds }}
  {{- else if and $sched.startingDeadlineSeconds (ne ($sched.startingDeadlineSeconds | toString) "") }}
  startingDeadlineSeconds: {{ $sched.startingDeadlineSeconds }}
  {{- end }}
  successfulJobsHistoryLimit: {{ $hist.successful | default 3 }}
  failedJobsHistoryLimit: {{ $hist.failed | default 1 }}
  jobTemplate:
    spec:
      backoffLimit: {{ $ex.retries | default 2 }}
      {{- with $ex.timeoutSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: scheduled-job
          {{- $cfgOn := (include "chart.configEnabled" .) | eq "true" -}}
          {{- $wifOn := (include "chart.workloadIdentityEnabled" .) | eq "true" -}}
          {{- if or $cfgOn $wifOn }}
          annotations:
            {{- if $cfgOn }}
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
            {{- end }}
            {{- if $wifOn }}
            checksum/wif: {{ include (print $.Template.BasePath "/wif-credentials.yaml") . | sha256sum }}
            {{- end }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- if .Values.serviceAccount.create }}
          serviceAccountName: {{ default .Release.Name .Values.serviceAccount.name }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: job
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- with $ex.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $ex.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- $wifEnv := include "app.workloadIdentityEnv" . | trim -}}
              {{- if ne $wifEnv "" }}
              env:
                {{- $wifEnv | nindent 16 }}
              {{- end }}
              {{- with include "app.envFrom" . }}
              {{- . | nindent 14 }}
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- include "app.workloadIdentityVolumeMounts" . | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
            {{- include "app.workloadIdentityVolumes" . | nindent 12 }}
