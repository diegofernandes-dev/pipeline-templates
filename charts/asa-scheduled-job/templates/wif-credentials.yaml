{{- if (include "chart.workloadIdentityEnabled" .) | eq "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.workloadIdentityConfigMapName" . }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{ include "chart.workloadIdentityCredentialsKey" . }}: |
{{- include "chart.workloadIdentityExternalAccount" . | nindent 4 }}
{{- end }}
