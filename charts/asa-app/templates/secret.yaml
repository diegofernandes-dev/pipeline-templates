{{- /*
  Renders a STANDARD Kubernetes Opaque Secret (base64, not encrypted at rest beyond etcd).
  Despite the pipeline-side `SEALED_*` prefix (historical name), there is NO SealedSecret or
  client-side encryption here. Keys arrive already stripped of the `SEALED_` prefix from the
  deploy overlay; the `replace "SECRET_" ""` below only affects values set directly on the chart.
  Future direction: External Secrets. See docs/parameters.md (SEALED_VARIABLES).
*/ -}}
{{- $secret := .Values.secret | default (dict) -}}
{{- $secretEnabled := get $secret "enabled" | default false -}}
{{- if $secretEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $key, $value := $secret }}
  {{- if ne $key "enabled" }}
  {{ $key | replace "SECRET_" "" }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
