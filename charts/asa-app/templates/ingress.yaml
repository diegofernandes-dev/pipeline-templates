{{- $profile := include "chart.workloadMode" . -}}
{{- if and ((include "chart.isDeployment" .) | eq "true") ((include "chart.ingressEnabled" .) | eq "true") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- $grpcAnnotations := dict }}
  {{- if eq $profile "grpc" }}
  {{-   $_ := set $grpcAnnotations "nginx.ingress.kubernetes.io/backend-protocol" "GRPC" }}
  {{- end }}
  {{- $allAnnotations := merge (.Values.ingress.annotations | default dict) $grpcAnnotations }}
  {{- if $allAnnotations }}
  annotations:
    {{- toYaml $allAnnotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ include "chart.ingressHost" . }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-svc
                port:
                  number: {{ .Values.service.port | default 8080 }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ include "chart.ingressHost" . }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
{{- end }}
