{{- if (include "chart.persistenceEnabled" .) | eq "true" }}
{{- $p := .Values.persistence | default dict -}}
{{- $size := $p.size | default "1Gi" -}}
{{- $modes := $p.accessModes | default (list "ReadWriteOnce") -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chart.pvcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: persistence
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | quote }}
  annotations:
    # Preserva a PVC em `helm uninstall` para evitar perda de dados.
    # Remoção é manual e intencional.
    helm.sh/resource-policy: keep
    {{- with $p.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- range $modes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ $size | quote }}
  {{- if $p.storageClass }}
  storageClassName: {{ $p.storageClass | quote }}
  {{- end }}
{{- end }}
