# Public contract: kind + workload.type. Ports are platform-owned (web=8080, grpc=50051).
kind: Application

workload:
  type: web
  # port is NOT part of the public contract — schema rejects workload.port

# Legacy .asa.com.br hostname (web/grpc only). Default false.
legacyDns: false

# Pipeline injects image + runtime.environment
image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

runtime:
  # develop | homolog | production — set by pipeline
  environment: develop

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

workloadIdentity:
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
    defaultMode: 420
  gcp:
    audience: ""
    serviceAccountEmail: ""
    projectId: ""

persistence:
  mountPath: ""
  size: ""
  storageClassName: ""

config: {}

externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []

# Opt-in probes. No presumed path.
# web: path (global or per-type). grpc: enabled on probe type (uses platform port).
# worker: probes not expected (fail if set with paths/enabled).
probes: {}

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Autoscaling (CPU HPA):
# - web/grpc: ON by default when omitted / empty map (platform min=1 max=3 target=70)
# - worker: OFF by default (not assumed idempotent); set an explicit map to opt in
# - autoscaling: false disables for any type
autoscaling: {}

pdb:
  enabled: false
  maxUnavailable: 1
