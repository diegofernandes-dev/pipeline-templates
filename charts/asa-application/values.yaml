# Public contract: kind + workload.type. Networked ports are platform-owned (web/grpc=8080).
kind: Application

workload:
  type: web
  # port is NOT part of the public contract — schema rejects workload.port

# Legacy .asa.com.br hostname (web/grpc only). Default false.
legacyDns: false

# Pipeline injects image + runtime.environment
image:
  repository: ""
  tag: latest
  # Immutable digest (sha256:...). Set by the GitOps/Kargo path; wins over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

runtime:
  # develop | homolog | production — set by pipeline
  environment: develop

# Platform always creates SA named after the release. Public: annotations only (IRSA).
serviceAccount:
  annotations: {}

workloadIdentity:
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    # Dedicated path — must NOT collide with IRSA (/var/run/secrets/eks.amazonaws.com/serviceaccount).
    mountPath: /var/run/secrets/gcp/serviceaccount
    defaultMode: 420
  gcp:
    audience: ""
    serviceAccountEmail: ""
    projectId: ""

persistence:
  mountPath: ""
  size: ""
  storageClassName: ""

# Free-form string map → ConfigMap. Use __ for .NET hierarchy (ConnectionStrings__Default).
# Reserved platform keys are rejected (ASPNETCORE_URLS, Kestrel__*, GOOGLE_APPLICATION_CREDENTIALS, …).
config: {}

externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []

# Networked (web/grpc): manifesto MUST set probes: false OR explicit probes.<type>.
# No default here — omission fails validation (fail-fast).
# probes: false

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Autoscaling (CPU HPA):
# - web/grpc: ON by default; minReplicas default 1 (develop/homolog) or 2 (production)
# - worker: OFF by default; set an explicit map to opt in
# - autoscaling: false disables for any type
autoscaling: {}

pdb:
  enabled: false
  maxUnavailable: 1
