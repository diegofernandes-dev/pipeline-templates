{{- if (include "chart.pdbEnabled" .) | eq "true" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  # Upstream recommends AlwaysAllow so a misbehaving app cannot block a node drain:
  # https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  # Default (IfHealthyBudget) makes drain wait for pods to become healthy first.
  unhealthyPodEvictionPolicy: {{ .Values.pdb.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- end }}
