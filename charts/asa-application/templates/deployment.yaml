{{- include "chart.validateApplication" . }}
{{- include "chart.validateWorkloadIdentity" . }}
{{- include "chart.validatePersistence" . }}
{{- include "chart.validateProbes" . }}
{{- include "chart.validateExternalSecret" . }}
{{- include "chart.validateConfig" . }}
{{- include "chart.validateShutdown" . }}
{{- include "chart.validateAutoscaling" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "chart.workloadType" . }}
spec:
  {{- if not ((include "chart.autoscalingEnabled" .) | eq "true") }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  # A pod flapping Ready must not count as rollout progress.
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  # Kept below the pipeline helmTimeout so a stalled rollout surfaces as a
  # ProgressDeadlineExceeded condition instead of a bare `helm --wait` timeout.
  progressDeadlineSeconds: {{ .Values.deployment.progressDeadlineSeconds }}
  {{- if (include "chart.persistenceEnabled" .) | eq "true" }}
  # RWO PVC: the old pod must release the volume before the new one starts.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deployment.rollingUpdate.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "chart.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "chart.workloadType" . }}
      {{- $cfgOn := (include "chart.configEnabled" .) | eq "true" -}}
      {{- $wifOn := (include "chart.workloadIdentityEnabled" .) | eq "true" -}}
      {{- if or $cfgOn $wifOn }}
      annotations:
        {{- if $cfgOn }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if $wifOn }}
        checksum/wif: {{ include (print $.Template.BasePath "/wif-credentials.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      # No implicit SVC_* env vars from every Service in the namespace.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Surface the crash reason in the pod status when the app dies without a message file.
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $wifEnv := include "app.workloadIdentityEnv" . | trim }}
          {{- $isNetworked := eq (include "chart.hasEndpoint" .) "true" }}
          {{- $isGrpc := eq (include "chart.workloadType" .) "grpc" }}
          env:
            # Runtime-agnostic contract — docker/<runtime>/entrypoint maps these.
            - name: SHUTDOWN_TIMEOUT_SECONDS
              value: {{ .Values.shutdownTimeoutSeconds | quote }}
            - name: CPU_REQUEST_MILLICORES
              valueFrom:
                resourceFieldRef:
                  containerName: app
                  resource: requests.cpu
                  divisor: 1m
            {{- if $isNetworked }}
            - name: PORT
              value: {{ include "chart.containerPort" . | quote }}
            - name: APP_PROTOCOL
              {{- if $isGrpc }}
              value: "h2c"
              {{- else }}
              value: "http"
              {{- end }}
            {{- end }}
            {{- if ne $wifEnv "" }}
            {{- $wifEnv | nindent 12 }}
            {{- end }}
          {{- with include "app.envFrom" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- if $isNetworked }}
          ports:
            - name: {{ if $isGrpc }}grpc{{ else }}http{{ end }}
              containerPort: {{ include "chart.containerPort" . }}
              protocol: TCP
          {{- end }}
          {{- with (include "chart.renderProbe" (list . "startup")) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with (include "chart.renderProbe" (list . "liveness")) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with (include "chart.renderProbe" (list . "readiness")) }}
          {{- . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if (include "chart.persistenceEnabled" .) | eq "true" }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- include "app.workloadIdentityVolumeMounts" . | nindent 12 }}
      {{- if and .Values.topologySpread.enabled (ge ((include "chart.effectiveMinReplicas" .) | int) 2) }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          # Soft on purpose — see values.yaml topologySpread.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ ((.Values.tmp | default dict).sizeLimit | default "128Mi") | quote }}
        {{- if (include "chart.persistenceEnabled" .) | eq "true" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chart.persistencePvcName" . }}
        {{- end }}
        {{- include "app.workloadIdentityVolumes" . | nindent 8 }}
