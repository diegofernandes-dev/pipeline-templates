{{- include "chart.validateApplication" . }}
{{- include "chart.validateWorkloadIdentity" . }}
{{- include "chart.validatePersistence" . }}
{{- include "chart.validateProbes" . }}
{{- include "chart.validateExternalSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ include "chart.workloadType" . }}
spec:
  {{- if not ((include "chart.autoscalingEnabled" .) | eq "true") }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if (include "chart.persistenceEnabled" .) | eq "true" }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ include "chart.workloadType" . }}
      {{- $cfgOn := (include "chart.configEnabled" .) | eq "true" -}}
      {{- $wifOn := (include "chart.workloadIdentityEnabled" .) | eq "true" -}}
      {{- if or $cfgOn $wifOn }}
      annotations:
        {{- if $cfgOn }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if $wifOn }}
        checksum/wif: {{ include (print $.Template.BasePath "/wif-credentials.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ default .Release.Name .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $wifEnv := include "app.workloadIdentityEnv" . | trim -}}
          {{- $isGrpc := eq (include "chart.workloadType" .) "grpc" -}}
          {{- if or $isGrpc (ne $wifEnv "") }}
          env:
            {{- if $isGrpc }}
            # Platform-owned gRPC listen (overrides Dockerfile ASPNETCORE_URLS=8080).
            - name: ASPNETCORE_URLS
              value: "http://+:{{ include "chart.containerPort" . }}"
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://0.0.0.0:{{ include "chart.containerPort" . }}"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: Http2
            {{- end }}
            {{- if ne $wifEnv "" }}
            {{- $wifEnv | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with include "app.envFrom" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- if (include "chart.hasEndpoint" .) | eq "true" }}
          ports:
            - name: {{ if eq (include "chart.workloadType" .) "grpc" }}grpc{{ else }}http{{ end }}
              containerPort: {{ include "chart.containerPort" . }}
              protocol: TCP
          {{- end }}
          {{- $probeCfg := (.Values.probes | default dict) -}}
          {{- if not (kindIs "map" $probeCfg) -}}{{- $probeCfg = dict -}}{{- end -}}
          {{- $startupCfg := $probeCfg.startup | default dict -}}
          {{- $readinessCfg := $probeCfg.readiness | default dict -}}
          {{- $livenessCfg := $probeCfg.liveness | default dict -}}
          {{- $startupMode := include "chart.probeTypeEnabled" (list . "startup") -}}
          {{- $readinessMode := include "chart.probeTypeEnabled" (list . "readiness") -}}
          {{- $livenessMode := include "chart.probeTypeEnabled" (list . "liveness") -}}
          {{- if eq $startupMode "http" }}
          startupProbe:
            httpGet:
              path: {{ include "chart.probeHttpPath" (list . "startup") | quote }}
              port: http
            failureThreshold: {{ $startupCfg.failureThreshold | default 30 }}
            periodSeconds: {{ $startupCfg.periodSeconds | default 5 }}
          {{- else if eq $startupMode "grpc" }}
          startupProbe:
            grpc:
              port: {{ include "chart.containerPort" . | int }}
            failureThreshold: {{ $startupCfg.failureThreshold | default 30 }}
            periodSeconds: {{ $startupCfg.periodSeconds | default 5 }}
          {{- end }}
          {{- if eq $livenessMode "http" }}
          livenessProbe:
            httpGet:
              path: {{ include "chart.probeHttpPath" (list . "liveness") | quote }}
              port: http
            initialDelaySeconds: {{ $livenessCfg.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $livenessCfg.periodSeconds | default 10 }}
            timeoutSeconds: {{ $livenessCfg.timeoutSeconds | default 3 }}
            failureThreshold: {{ $livenessCfg.failureThreshold | default 3 }}
          {{- else if eq $livenessMode "grpc" }}
          livenessProbe:
            grpc:
              port: {{ include "chart.containerPort" . | int }}
            initialDelaySeconds: {{ $livenessCfg.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $livenessCfg.periodSeconds | default 10 }}
            timeoutSeconds: {{ $livenessCfg.timeoutSeconds | default 3 }}
            failureThreshold: {{ $livenessCfg.failureThreshold | default 3 }}
          {{- end }}
          {{- if eq $readinessMode "http" }}
          readinessProbe:
            httpGet:
              path: {{ include "chart.probeHttpPath" (list . "readiness") | quote }}
              port: http
            initialDelaySeconds: {{ $readinessCfg.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $readinessCfg.periodSeconds | default 10 }}
            timeoutSeconds: {{ $readinessCfg.timeoutSeconds | default 3 }}
            failureThreshold: {{ $readinessCfg.failureThreshold | default 3 }}
          {{- else if eq $readinessMode "grpc" }}
          readinessProbe:
            grpc:
              port: {{ include "chart.containerPort" . | int }}
            initialDelaySeconds: {{ $readinessCfg.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $readinessCfg.periodSeconds | default 10 }}
            timeoutSeconds: {{ $readinessCfg.timeoutSeconds | default 3 }}
            failureThreshold: {{ $readinessCfg.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if (include "chart.persistenceEnabled" .) | eq "true" }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- include "app.workloadIdentityVolumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if (include "chart.persistenceEnabled" .) | eq "true" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chart.persistencePvcName" . }}
        {{- end }}
        {{- include "app.workloadIdentityVolumes" . | nindent 8 }}
