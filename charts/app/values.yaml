replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

# Empty on AWS/EKS (node/IRSA). Lab may set via --set imagePullSecrets[0].name=…
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

service:
  port: 8080

# Baseline API .NET: CPU request only (no CPU limit — avoid artificial throttling).
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

# Platform contract: ASP.NET health endpoint at /health-check (startup/liveness/readiness).
probes:
  path: /health-check
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  startup:
    failureThreshold: 30
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Technical HPA baseline (CPU). min/max are availability policy — override per env if needed.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Off by default: with minReplicas 1, maxUnavailable 1 allows 0 available pods.
# Enable only when availability policy warrants it (typically minReplicas >= 2).
pdb:
  enabled: false
  maxUnavailable: 1

httpRoute:
  enabled: true
  exposeAsaComBr: false
  # develop | homolog | production — derives hostnames + Gateway parentRef
  environment: develop
  # Empty ⇒ derived from environment; non-empty overrides completely
  hostnames: []
