replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /health-check
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

httpRoute:
  enabled: true
  parentRefs:
    - name: d-asa-com-br-internal-gateway
      namespace: asa-infra-nginx-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  # Empty ⇒ default hostname <release>.dev.asa.corp
  hostnames: []
