replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /health-check
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  startup:
    failureThreshold: 30
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  maxUnavailable: 1

httpRoute:
  enabled: true
  exposeAsaComBr: false
  # develop | homolog | production — derives *.asa.corp / *.asa.com.br hostnames
  environment: develop
  parentRefs:
    - name: d-asa-com-br-internal-gateway
      namespace: asa-infra-nginx-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  # Empty ⇒ derived from environment; non-empty overrides completely
  hostnames: []
