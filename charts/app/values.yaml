replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

# Empty by default — pipeline does not create imagePullSecrets; cluster/node runtime pulls from ECR.
# Lab may pass a pre-provisioned secret name via pipeline variable ECR_PULL_SECRET.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  # IRSA: set eks.amazonaws.com/role-arn via per-env manifesto (deploy/config/<env>.yaml).
  annotations: {}
  automountServiceAccountToken: false

# EKS → GCP Workload Identity Federation (Pub/Sub etc.). Opt-in via manifesto.
# Point credentialsConfigMapName at a pre-existing ConfigMap (or one synced by ESO).
workloadIdentity:
  enabled: false
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
    defaultMode: 420
  gcp:
    credentialsConfigMapName: ""
    credentialsConfigMapKey: external-account.json
    projectId: ""

# Non-sensitive app config → ConfigMap → envFrom (manifesto: config.enabled + config.data).
config:
  enabled: false
  data: {}

# Application secrets via External Secrets Operator (manifesto declares refs only — no secret values in Git).
# Requires ESO + SecretStore/ClusterSecretStore on the cluster (platform infra).
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []
  # data item: { secretKey: ENV_NAME, remoteRef: { key: path/in/store, property: optional } }

service:
  port: 8080

# Baseline API .NET: CPU request only (no CPU limit — avoid artificial throttling).
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

# Platform contract: ASP.NET health endpoint at /health-check (startup/liveness/readiness).
probes:
  path: /health-check
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  startup:
    failureThreshold: 30
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Technical HPA baseline (CPU). min/max are availability policy — override per env if needed.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Off by default: with minReplicas 1, maxUnavailable 1 allows 0 available pods.
# Enable only when availability policy warrants it (typically minReplicas >= 2).
pdb:
  enabled: false
  maxUnavailable: 1

httpRoute:
  enabled: true
  exposeAsaComBr: false
  # develop | homolog | production — derives hostnames + Gateway parentRef
  environment: develop
  # Empty ⇒ derived from environment; non-empty overrides completely
  hostnames: []
