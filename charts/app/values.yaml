replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

# Empty by default — pipeline does not create imagePullSecrets; cluster/node runtime pulls from ECR.
# Lab may pass a pre-provisioned secret name via pipeline variable ECR_PULL_SECRET.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  # IRSA: set eks.amazonaws.com/role-arn via per-env manifesto (deploy/config/<env>.yaml).
  annotations: {}
  automountServiceAccountToken: false

# EKS → GCP Workload Identity Federation (Pub/Sub etc.). Opt-in via manifesto.
# Presence: gcp.audience non-empty ⇒ on (chart creates external_account ConfigMap).
# Opt-out in an env: workloadIdentity: false
# token.audience = projected SA TokenRequest aud (default sts.amazonaws.com; corporate EKS→GCP).
# gcp.audience = external_account JSON aud (GCP Workload Identity Provider resource name).
workloadIdentity:
  token:
    audience: sts.amazonaws.com
    expirationSeconds: 3600
    fileName: token
    mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
    defaultMode: 420
  gcp:
    audience: ""
    serviceAccountEmail: ""
    projectId: ""

# Opt-in PVC (1 claim → 1 mountPath). Presence: mountPath non-empty ⇒ on.
# Requires autoscaling: false and replicaCount: 1 (RWO). Forces Deployment strategy Recreate.
# Opt-out: persistence: false. PVC keeps data on helm uninstall (helm.sh/resource-policy: keep).
persistence:
  mountPath: ""
  size: ""
  storageClassName: ""

# Opt-in CronJob (additional to the API Deployment — does not disable web resources).
# Presence: schedule non-empty ⇒ on. Requires command and/or args (fail-fast if both empty).
# Opt-out: cronJob: false
# Reuses image, SA, IRSA/WIF, config/secret, securityContext, resources. No HTTP probes. No PVC mount.
cronJob:
  schedule: ""
  command: []
  args: []
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  backoffLimit: 2

# Non-sensitive app config → ConfigMap → envFrom.
# Non-empty map ⇒ on. Omit or {} ⇒ off. (no enabled/data nesting)
config: {}

# Application secrets via External Secrets Operator (refs only — no secret values in Git).
# Opt-in: non-empty data[] AND secretStoreRef.name. Partial config fails at helm template.
# Requires ESO CRDs + ClusterSecretStore/SecretStore on the target cluster (platform infra).
externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  data: []
  # data item: { secretKey: ENV_NAME, remoteRef: { key: path/in/store, property: optional } }

service:
  port: 8080

# Baseline API .NET: CPU request only (no CPU limit — avoid artificial throttling).
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

# Platform contract: ASP.NET health endpoint at /health-check (startup/liveness/readiness).
probes:
  path: /health-check
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  startup:
    failureThreshold: 30
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# HPA baseline (CPU). Non-empty map ⇒ on. To disable in an env manifesto: autoscaling: false
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Off by default: with minReplicas 1, maxUnavailable 1 allows 0 available pods.
# Enable only when availability policy warrants it (typically minReplicas >= 2).
pdb:
  enabled: false
  maxUnavailable: 1

httpRoute:
  enabled: true
  exposeAsaComBr: false
  # develop | homolog | production — derives hostnames + Gateway parentRef
  environment: develop
  # Empty ⇒ derived from environment; non-empty overrides completely
  hostnames: []
