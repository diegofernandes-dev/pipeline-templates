{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret -}}
{{- $_ := required "externalSecret.secretStoreRef.name is required when externalSecret.enabled=true" ($es.secretStoreRef.name | default "") -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ $es.secretStoreRef.name | quote }}
  target:
    name: {{ .Release.Name }}-secret
    creationPolicy: Owner
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
