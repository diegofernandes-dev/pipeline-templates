{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  {{- if .Values.httpRoute.exposeAsaComBr }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ printf "%s.d.asa.com.br" .Release.Name | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- if .Values.httpRoute.hostnames }}
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
    {{- else }}
    - {{ printf "%s.dev.asa.corp" .Release.Name | quote }}
    {{- if .Values.httpRoute.exposeAsaComBr }}
    - {{ printf "%s.d.asa.com.br" .Release.Name | quote }}
    {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
{{- end }}
