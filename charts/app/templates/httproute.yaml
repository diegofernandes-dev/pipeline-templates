{{- if .Values.httpRoute.enabled }}
{{- $env := .Values.httpRoute.environment | default "develop" }}
{{- $corpZone := dict "develop" "dev.asa.corp" "homolog" "hml.asa.corp" "production" "prd.asa.corp" }}
{{- $comBrZone := dict "develop" "d.asa.com.br" "homolog" "h.asa.com.br" "production" "p.asa.com.br" }}
{{- $gatewayByEnv := dict "develop" "d-asa-com-br-internal-gateway" "homolog" "h-asa-com-br-internal-gateway" "production" "p-asa-com-br-internal-gateway" }}
{{- $corpHost := printf "%s.%s" .Release.Name (index $corpZone $env | default "dev.asa.corp") }}
{{- $comBrHost := printf "%s.%s" .Release.Name (index $comBrZone $env | default "d.asa.com.br") }}
{{- $gatewayName := index $gatewayByEnv $env | default "d-asa-com-br-internal-gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: asa-infra-nginx-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    {{- if .Values.httpRoute.hostnames }}
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
    {{- else }}
    - {{ $corpHost | quote }}
    {{- if .Values.httpRoute.exposeAsaComBr }}
    - {{ $comBrHost | quote }}
    {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
{{- end }}
