# Example per-environment manifesto (copy to the app repo as deploy/config/develop.yaml).
# Pipeline applies: helm upgrade -f deploy/config/<ADO_ENVIRONMENT>.yaml
# Rule: if you set a block, it applies. Omit the block to keep chart defaults.
# Do NOT put secret values here — use externalSecret refs (ESO).

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
# autoscaling: false   # opt-out of HPA for this env

# serviceAccount:
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/sample-api-develop

# Chart creates {release}-wif-credentials ConfigMap (external_account). No pre-provisioned CM.
# workloadIdentity:
#   gcp:
#     audience: //iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#     serviceAccountEmail: app-sa@my-gcp-project.iam.gserviceaccount.com
#     projectId: my-gcp-project
# workloadIdentity: false   # opt-out for this env

# RWO PVC — requires autoscaling: false and replicaCount: 1. Survives helm uninstall (keep).
# persistence:
#   mountPath: /data
#   size: 1Gi
#   # storageClassName: gp3
# persistence: false

config:
  API_URL: https://api.dev.example
  FEATURE_FLAG: "true"

