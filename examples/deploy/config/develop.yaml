# Example Application manifesto (copy to deploy/config/<tier>.yaml).
# Public contract: kind + workload.type. Networked ports are platform-owned (8080).
# Pipeline selects chart from kind (asa-application). Schema: schemas/application.manifest.schema.json

kind: Application

workload:
  type: web
  # port is NOT part of the public contract — schema rejects workload.port

# DNS publication intent (web/grpc). Route acceptance is independent:
# when platform.legacyDnsZone is set, HTTPRoute/GRPCRoute always accept corp + legacy.
# This flag only authorizes ExternalDNS to publish the legacy hostname.
# false = publish .corp only. Removed key legacyDns is rejected by schema.
dns:
  publishLegacyHostname: false

# Required for web/grpc: probes: false OR explicit probes.<type> (no global path).
probes: false

# Object form renders HPA → deploy preflight requires metrics.k8s.io.
# Use autoscaling: false to skip HPA (and the metrics check).
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  cpu:
    target: 70

