# Free-form string map → ConfigMap. Nested .NET keys use __ (not ':').
# Reserved platform keys rejected: PORT, APP_PROTOCOL, SHUTDOWN_TIMEOUT_SECONDS,
# CPU_REQUEST_MILLICORES, GOOGLE_APPLICATION_CREDENTIALS (+ runtime-reserved keys).
config:
  API_URL: https://api.dev.example
  FEATURE_FLAG: "true"
