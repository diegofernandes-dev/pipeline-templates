# Example per-environment manifesto (copy to the app repo as deploy/config/develop.yaml).
# Pipeline applies: helm upgrade -f deploy/config/<ADO_ENVIRONMENT>.yaml
# Rule: if you set a block, it applies. Omit the block to keep chart defaults.
# Do NOT put secret values here — use externalSecret refs (ESO) or a pre-provisioned ConfigMap for WIF JSON.

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
# autoscaling: false   # opt-out of HPA for this env

