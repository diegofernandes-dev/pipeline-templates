# Example Application manifesto (copy to deploy/config/develop.yaml).
# Pipeline selects chart from kind (asa-application). Ports are platform-owned.

kind: Application

workload:
  type: web

legacyDns: false

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  cpu:
    target: 70

