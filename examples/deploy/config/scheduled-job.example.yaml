# Example ScheduledJob manifesto (separate deployable / applicationName / release).
# Public contract: kind + schedule + execution.timeoutSeconds.
# Pipeline selects charts/asa-scheduled-job from kind.
# Schema: schemas/scheduled-job.manifest.schema.json
# Prefer execution.args over execution.command so the image entrypoint/adapter runs.

kind: ScheduledJob

schedule:
  expression: "0 2 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  # Optional: how late an occurrence may still start (semantic app decision).
  startingDeadlineSeconds: 600

execution:
  # Required — maps to Job activeDeadlineSeconds.
  timeoutSeconds: 1800
  retries: 2
  args:
    - --mode=job

history:
  successful: 2
  failed: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

