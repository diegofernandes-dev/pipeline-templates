# Exemplo de consumo do template CI .NET 10 (+ imagem ECR).
# Copie para o repositório consumidor e ajuste solution / ECR / service connection.

trigger:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      name: diegofernandes-dev/pipeline-templates
      endpoint: github-diegofernandes-dev # service connection GitHub no Azure DevOps
      ref: refs/heads/main

extends:
  template: templates/dotnet/ci.yml@templates
  parameters:
    solution: '**/*.sln'
    buildConfiguration: 'Release'
    # additionalSdkVersions: ['8.x']  # se o app/testes forem TFM mais antigo (ex. net8.0)
    buildImage: true
    containerPool: 'PG-AWS-EKS'
    ecrRepository: 'my-api'
    # awsAccountId: '448003890252'
    # awsRegion: 'us-east-1'
    # dockerfile: 'Dockerfile'
