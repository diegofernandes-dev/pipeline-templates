trigger:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      name: diegofernandes-dev/pipeline-templates
      endpoint: github-diegofernandes-dev
      ref: refs/tags/v5.0.0

extends:
  template: templates/dotnet/ci.yml@templates
  parameters:
    solution: '**/*.sln'
    applicationName: sample-api
    dotnetProject: src/Sample.Api/Sample.Api.csproj
    # Area profile owns buildPool, deploy pools, registry, and ADO Environments.
    platformArea: lab
    deployEnvironments:
      - name: develop
        variableGroups: []
      - name: homolog
        variableGroups: []
