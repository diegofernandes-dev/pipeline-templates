# Example consumer pipeline (extends templates/dotnet/ci.yml).
# Pin an immutable tag — do not track main for production consumers.
#
# v6 public API: select platformArea; platform owns promotion topology.
# platformArea: none → CI only.
trigger:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      name: diegofernandes-dev/pipeline-templates
      endpoint: github-diegofernandes-dev
      # v6.0.0 candidate — pin exact commit SHA until the tag exists (≠ v5.3.2 API)
      ref: refs/heads/main

extends:
  template: templates/dotnet/ci.yml@templates
  parameters:
    solution: '**/*.sln'
    # One deployable = one ECR image = one Helm release = namespace asa-<name> = hostname.
    applicationName: sample-api
    dotnetProject: src/Sample.Api/Sample.Api.csproj
    # Runtime profile (platform/runtimes/<name>.yml) injected before the manifesto.
    runtime: dotnet
    # Manifestos por tier: deploy/config/<tier>.yaml for every platform.promotion entry.
    # runtimeConfigPath: deploy/config
    # Area profile owns promotion chain, pools, ADO Environments, cluster identity, Gateway/DNS.
    platformArea: lab
