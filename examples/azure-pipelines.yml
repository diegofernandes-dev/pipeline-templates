trigger:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      name: diegofernandes-dev/pipeline-templates
      endpoint: github-diegofernandes-dev
      # v5.3.0 is RETIRADA (tagged before repository CI was green). Prefer v5.3.1 when
      # published after platform-ci success on that SHA; until then pin a green commit or main.
      ref: refs/heads/main

extends:
  template: templates/dotnet/ci.yml@templates
  parameters:
    solution: '**/*.sln'
    applicationName: sample-api
    dotnetProject: src/Sample.Api/Sample.Api.csproj
    # Area profile owns buildPool, deploy pools, registry, and ADO Environments.
    platformArea: lab
    deployEnvironments:
      - name: develop
        variableGroups: []
      - name: homolog
        variableGroups: []
