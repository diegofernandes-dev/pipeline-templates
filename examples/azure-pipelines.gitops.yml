# Example consumer pipeline — deliveryMode: gitops (Kargo + Argo CD).
#
# The consumer declares WHAT is built, not WHERE it runs:
#   no deployEnvironments, no expectedKubeContext, no variableGroups,
#   no gateway, no cluster, no promotion order.
#
# After this pipeline pushes the image to ECR, the artifact lifecycle belongs to
# Kargo: Warehouse → Freight → Stage develop → Stage homolog → Argo CD → EKS.
# The desired state (values with image.digest) lives in the GitOps repository,
# never in this repo and never in a branch of this repo.

trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: github
      name: diegofernandes-dev/pipeline-templates
      endpoint: github-diegofernandes-dev
      ref: refs/heads/main

extends:
  template: templates/dotnet/ci.yml@templates
  parameters:
    solution: '**/*.sln'
    applicationName: sample-api
    dotnetProject: src/Sample.Api/Sample.Api.csproj
    deliveryMode: gitops
    # Build pool only (BuildKit + ECR). Still infrastructure — next surface to remove
    # from the public API once the GitOps path replaces the Helm path.
    containerPool: 'PG-AWS-EKS'
