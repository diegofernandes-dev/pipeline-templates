# Stage reutilizável: Helm deploy em um Environment ADO.
# Namespace: asa-<applicationName> (sem sufixo; mesmo nome em cada cluster).
# Manifesto obrigatório: deploy/config/<tier>.yaml com kind: Application|ScheduledJob.
# Chart path is resolved from kind (never exposed to the consumer).
#
# Operational requirement: Azure DevOps Environments used for deploy MUST enable
# exclusive lock / one deployment at a time per environment (no bash lock here).
parameters:
  # Logical tier (develop|homolog|production) — stage name, manifesto path, dependsOn.
  - name: tier
    type: string

  # Physical ADO Environment name (from platform.tiers.<tier>.environmentName).
  - name: environmentName
    type: string

  - name: platformArea
    type: string

  - name: dependsOn
    type: object
    default:
      - Container

  - name: applicationName
    type: string

  - name: containerPool
    type: string

  - name: awsRegion
    type: string

  # Platform deploy policy (not consumer-owned). Default matches prior contract.
  - name: helmTimeout
    type: string
    default: '5m'

  - name: runtimeConfigPath
    type: string
    default: 'deploy/config'

  - name: runtime
    type: string
    default: 'dotnet'

stages:
  - stage: Deploy_${{ parameters.tier }}
    displayName: Deploy ${{ parameters.tier }} (${{ parameters.platformArea }})
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    variables:
      - name: imageRepository
        value: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageRepository'] ]
      - name: imageTag
        value: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageTag'] ]
    jobs:
      - deployment: Helm_${{ parameters.tier }}
        displayName: Helm upgrade (${{ parameters.tier }})
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.containerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - checkout: self
                  displayName: Checkout app
                  path: app

                - checkout: templates
                  displayName: Checkout chart
                  path: pipeline-templates

                - task: Bash@3
                  displayName: helm upgrade --install
                  env:
                    APPLICATION_NAME: ${{ parameters.applicationName }}
                    PLATFORM_AREA: ${{ parameters.platformArea }}
                    PLATFORM_TIER: ${{ parameters.tier }}
                    ADO_ENVIRONMENT: ${{ parameters.environmentName }}
                    HELM_TIMEOUT: ${{ parameters.helmTimeout }}
                    AWS_REGION: ${{ parameters.awsRegion }}
                    AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                    IMAGE_REPOSITORY: $(imageRepository)
                    IMAGE_TAG: $(imageTag)
                    RUNTIME_CONFIG_PATH: ${{ parameters.runtimeConfigPath }}
                    PLATFORM_RUNTIME: ${{ parameters.runtime }}
                  inputs:
                    targetType: inline
                    script: |
                      set -Eeuo pipefail

                      WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                      TEMPLATES_DIR="${WORKSPACE}/pipeline-templates"
                      APP_DIR="${WORKSPACE}/app"
                      MANIFEST="${APP_DIR}/${RUNTIME_CONFIG_PATH}/${PLATFORM_TIER}.yaml"
                      HELM_RELEASE="${APPLICATION_NAME}"
                      HELM_NAMESPACE="asa-${APPLICATION_NAME}"

                      dump_diagnostics() {
                        echo "##[group]deploy diagnostics"
                        kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,pdb,sa,cronjob,pods,httproute,grpcroute,externalsecret,configmap,pvc -o wide 2>/dev/null || true
                        kubectl -n "${HELM_NAMESPACE}" get events --sort-by=.lastTimestamp 2>/dev/null | tail -60 || true
                        for p in $(kubectl -n "${HELM_NAMESPACE}" get pods -o name 2>/dev/null || true); do
                          echo "--- describe ${p} ---"
                          kubectl -n "${HELM_NAMESPACE}" describe "${p}" 2>/dev/null | tail -100 || true
                          echo "--- logs ${p} ---"
                          kubectl -n "${HELM_NAMESPACE}" logs "${p}" --all-containers=true --tail=100 2>/dev/null || true
                        done
                        for r in httproute grpcroute; do
                          for obj in $(kubectl -n "${HELM_NAMESPACE}" get "${r}" -o name 2>/dev/null || true); do
                            echo "--- ${obj} status ---"
                            kubectl -n "${HELM_NAMESPACE}" get "${obj}" -o yaml 2>/dev/null | yq -r '.status // {}' || true
                          done
                        done
                        helm status "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" 2>/dev/null || true
                        helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" 2>/dev/null || true
                        echo "##[endgroup]"
                      }

                      require_cmd() {
                        local c="$1"
                        if ! command -v "${c}" >/dev/null 2>&1; then
                          echo "##vso[task.logissue type=error]Required tool '${c}' not found on agent — install on the self-hosted pool (no ad-hoc download in deploy)"
                          exit 1
                        fi
                      }

                      require_cmd kubectl
                      require_cmd helm
                      require_cmd yq
                      require_cmd aws
                      require_cmd python3

                      HELM_V="$(helm version --short 2>/dev/null || true)"
                      echo "helm: ${HELM_V}"
                      if [[ ! "${HELM_V}" =~ ^v?3\. ]]; then
                        echo "##vso[task.logissue type=error]Unsupported Helm version '${HELM_V}' — platform requires Helm 3.x"
                        exit 1
                      fi

                      if ! python3 -c 'import yaml, jsonschema' >/dev/null 2>&1; then
                        echo "##vso[task.logissue type=error]Python packages PyYAML + jsonschema required on agent (pinned install on pool; no pip in deploy)"
                        exit 1
                      fi

                      if [[ -z "${APPLICATION_NAME:-}" ]]; then
                        echo "##vso[task.logissue type=error]applicationName is required"
                        exit 1
                      fi

                      if [[ ! -f "${MANIFEST}" ]]; then
                        echo "##vso[task.logissue type=error]Manifesto required at ${MANIFEST}"
                        exit 1
                      fi

                      # Single source of truth: platform/areas/<area>.yml via the resolver.
                      PLATFORM_VALUES="$(mktemp -t asa-platform.XXXXXX.yaml)"
                      PLATFORM_FACTS="$(mktemp -t asa-platform-facts.XXXXXX.yaml)"
                      RUNTIME_VALUES="$(mktemp -t asa-runtime.XXXXXX.yaml)"
                      PREFLIGHT_RENDER=""
                      cleanup_deploy_temps() {
                        rm -f "${PLATFORM_VALUES}" "${PLATFORM_FACTS}" "${RUNTIME_VALUES}" \
                          ${PREFLIGHT_RENDER:+"${PREFLIGHT_RENDER}" "${PREFLIGHT_RENDER}.err"}
                      }
                      trap cleanup_deploy_temps EXIT
                      if ! bash "${TEMPLATES_DIR}/scripts/resolve-platform-values.sh" \
                           "${PLATFORM_AREA}" "${PLATFORM_TIER}" "${PLATFORM_VALUES}"; then
                        echo "##vso[task.logissue type=error]Failed to resolve platform values for '${PLATFORM_AREA}/${PLATFORM_TIER}'"
                        exit 1
                      fi
                      if ! bash "${TEMPLATES_DIR}/scripts/resolve-platform-values.sh" \
                           "${PLATFORM_AREA}" "${PLATFORM_TIER}" --facts "${PLATFORM_FACTS}"; then
                        echo "##vso[task.logissue type=error]Failed to resolve platform facts for '${PLATFORM_AREA}/${PLATFORM_TIER}'"
                        exit 1
                      fi

                      KIND="$(yq -r '.kind // ""' "${MANIFEST}")"
                      case "${KIND}" in
                        Application)
                          CHART_DIR="${TEMPLATES_DIR}/charts/asa-application"
                          PUBLIC_SCHEMA="${TEMPLATES_DIR}/schemas/application.manifest.schema.json"
                          WT="$(yq -r '.workload.type // ""' "${MANIFEST}")"
                          case "${WT}" in
                            web|grpc|worker) RUNTIME_WORKLOAD="${WT}" ;;
                            *)
                              echo "##vso[task.logissue type=error]Application requires workload.type web|grpc|worker (got '${WT}')"
                              exit 1
                              ;;
                          esac
                          ;;
                        ScheduledJob)
                          CHART_DIR="${TEMPLATES_DIR}/charts/asa-scheduled-job"
                          PUBLIC_SCHEMA="${TEMPLATES_DIR}/schemas/scheduled-job.manifest.schema.json"
                          RUNTIME_WORKLOAD=scheduledJob
                          ;;
                        *)
                          echo "##vso[task.logissue type=error]Unsupported kind '${KIND}' in ${MANIFEST}"
                          exit 1
                          ;;
                      esac

                      if ! bash "${TEMPLATES_DIR}/scripts/resolve-runtime-values.sh" \
                           "${PLATFORM_RUNTIME}" "${RUNTIME_WORKLOAD}" "${RUNTIME_VALUES}"; then
                        echo "##vso[task.logissue type=error]Failed to resolve runtime values for '${PLATFORM_RUNTIME}/${RUNTIME_WORKLOAD}'"
                        exit 1
                      fi
                      EXPECTED_KUBE_CONTEXT="$(yq -r '.cluster.expectedKubeContext // ""' "${PLATFORM_FACTS}")"
                      PSA_ENFORCE="$(yq -r '.cluster.podSecurity.enforce // ""' "${PLATFORM_FACTS}")"
                      PSA_ENFORCE_VERSION="$(yq -r '.cluster.podSecurity.enforceVersion // ""' "${PLATFORM_FACTS}")"
                      CLUSTER_AWS_ACCOUNT="$(yq -r '.cluster.awsAccountId // ""' "${PLATFORM_FACTS}")"
                      SMOKE_ALLOWED="$(yq -r '.cluster.smokeAllowed // "false"' "${PLATFORM_FACTS}")"
                      REGISTRY_ACCOUNT="$(yq -r '.registry.awsAccountId // ""' "${PLATFORM_FACTS}")"
                      REGISTRY_REGION="$(yq -r '.registry.awsRegion // ""' "${PLATFORM_FACTS}")"

                      if [[ ! -f "${CHART_DIR}/Chart.yaml" ]]; then
                        echo "##vso[task.logissue type=error]Chart not found: ${CHART_DIR}"
                        exit 1
                      fi

                      if [[ -z "${IMAGE_REPOSITORY:-}" || -z "${IMAGE_TAG:-}" ]]; then
                        echo "##vso[task.logissue type=error]imageRepository/imageTag missing from Container stage"
                        exit 1
                      fi

                      echo "##[group]target identity (fail-closed)"
                      CTX="$(kubectl config current-context 2>/dev/null || true)"
                      echo "kubectl context: ${CTX}"
                      CALLER_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
                      aws sts get-caller-identity
                      if ! bash "${TEMPLATES_DIR}/scripts/preflight-deploy-target.sh" identity \
                           --area "${PLATFORM_AREA}" --tier "${PLATFORM_TIER}" \
                           --expected-context "${EXPECTED_KUBE_CONTEXT}" \
                           --actual-context "${CTX}" \
                           --expected-account "${CLUSTER_AWS_ACCOUNT}" \
                           --actual-account "${CALLER_ACCOUNT}"; then
                        echo "##vso[task.logissue type=error]Target identity validation failed for ${PLATFORM_AREA}/${PLATFORM_TIER} — deployment refused"
                        exit 1
                      fi
                      echo "##[endgroup]"

                      echo "##[group]validate public manifesto schema"
                      python3 "${TEMPLATES_DIR}/scripts/validate-manifest.py" "${PUBLIC_SCHEMA}" "${MANIFEST}"
                      echo "##[endgroup]"

                      echo "##[group]ensure namespace ${HELM_NAMESPACE}"
                      kubectl create namespace "${HELM_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
                      kubectl label namespace "${HELM_NAMESPACE}" \
                        app.kubernetes.io/managed-by=pipeline-templates \
                        app.kubernetes.io/name="${HELM_RELEASE}" \
                        --overwrite >/dev/null
                      # Pod Security Admission. Per-cluster because clusters may enforce
                      # differently; null in the mapping means "do not label" (no guessed policy).
                      if [[ -n "${PSA_ENFORCE}" && "${PSA_ENFORCE}" != "null" ]]; then
                        case "${PSA_ENFORCE}" in
                          privileged|baseline|restricted) ;;
                          *)
                            echo "##vso[task.logissue type=error]podSecurity.enforce for ${PLATFORM_AREA}/${PLATFORM_TIER} must be privileged, baseline or restricted (got '${PSA_ENFORCE}')"
                            exit 1
                            ;;
                        esac
                        if [[ -z "${PSA_ENFORCE_VERSION}" || "${PSA_ENFORCE_VERSION}" == "null" ]]; then
                          echo "##vso[task.logissue type=error]podSecurity.enforce is set for ${PLATFORM_AREA}/${PLATFORM_TIER} but podSecurity.enforceVersion is null — pin the version so an upgraded cluster cannot silently change what is enforced"
                          exit 1
                        fi
                        echo "Labelling ${HELM_NAMESPACE} with PSA enforce=${PSA_ENFORCE} (${PSA_ENFORCE_VERSION})"
                        kubectl label namespace "${HELM_NAMESPACE}" \
                          "pod-security.kubernetes.io/enforce=${PSA_ENFORCE}" \
                          "pod-security.kubernetes.io/enforce-version=${PSA_ENFORCE_VERSION}" \
                          --overwrite >/dev/null
                      else
                        echo "##[warning]podSecurity.enforce for ${PLATFORM_AREA}/${PLATFORM_TIER} is null — namespace is NOT Pod-Security labelled"
                      fi
                      echo "##[endgroup]"

                      WT=""

                      # Assert the EXACT group/version the charts apply, not merely that the
                      # resource exists under some served version. A cluster offering only
                      # external-secrets.io/v1beta1 or Gateway API v1alpha2 passes a bare
                      # api-group check and then fails at apply time.
                      require_api() {
                        local group_version="$1" resource="$2" used_by="$3"
                        if ! kubectl get --raw "/apis/${group_version}" 2>/dev/null \
                          | yq -r '.resources[].name' 2>/dev/null | grep -qx "${resource}"; then
                          echo "##vso[task.logissue type=error]Cluster does not serve ${group_version} with resource '${resource}' (required by ${used_by})"
                          exit 1
                        fi
                        echo "${group_version} serves ${resource} (${used_by})"
                      }

                      echo "##[group]preflight APIs / CRDs / Gateway / metrics"
                      # Render once and derive required APIs from the kinds that WILL be applied.
                      # Avoids re-implementing chart.autoscalingEnabled / workload branching in bash.
                      PREFLIGHT_RENDER="$(mktemp -t asa-preflight.XXXXXX.yaml)"
                      PREFLIGHT_CMD=(
                        helm template "${HELM_RELEASE}" "${CHART_DIR}"
                        -f "${RUNTIME_VALUES}"
                        -f "${MANIFEST}"
                        -f "${PLATFORM_VALUES}"
                        --set-string "image.repository=${IMAGE_REPOSITORY}"
                        --set-string "image.tag=${IMAGE_TAG}"
                      )
                      if ! "${PREFLIGHT_CMD[@]}" > "${PREFLIGHT_RENDER}" 2>"${PREFLIGHT_RENDER}.err"; then
                        echo "##vso[task.logissue type=error]helm template (preflight) failed — manifesto violates a chart invariant"
                        cat "${PREFLIGHT_RENDER}.err" || true
                        exit 1
                      fi
                      echo "preflight render ok ($(grep -c '^kind:' "${PREFLIGHT_RENDER}" || true) objects)"

                      # Confirm the image exists in the shared registry and the agent can see it.
                      if [[ -n "${REGISTRY_ACCOUNT}" && "${REGISTRY_ACCOUNT}" != "null" ]]; then
                        ECR_REPO_NAME="${IMAGE_REPOSITORY##*/}"
                        ECR_DESC_REGION="${REGISTRY_REGION:-${AWS_REGION}}"
                        echo "Checking image ${ECR_REPO_NAME}:${IMAGE_TAG} in registry ${REGISTRY_ACCOUNT} (${ECR_DESC_REGION})"
                        if ! aws ecr describe-images \
                             --registry-id "${REGISTRY_ACCOUNT}" \
                             --repository-name "${ECR_REPO_NAME}" \
                             --image-ids "imageTag=${IMAGE_TAG}" \
                             --region "${ECR_DESC_REGION}" >/dev/null 2>&1; then
                          echo "##vso[task.logissue type=error]Image ${ECR_REPO_NAME}:${IMAGE_TAG} not found in shared ECR ${REGISTRY_ACCOUNT} (or agent lacks ecr:DescribeImages)"
                          exit 1
                        fi
                        echo "shared ECR image present"
                      fi

                      if grep -qx 'kind: HTTPRoute' "${PREFLIGHT_RENDER}"; then
                        require_api gateway.networking.k8s.io/v1 httproutes "HTTPRoute"
                      fi
                      if grep -qx 'kind: GRPCRoute' "${PREFLIGHT_RENDER}"; then
                        # GRPCRoute is only v1 from Gateway API 1.1 onwards.
                        require_api gateway.networking.k8s.io/v1 grpcroutes "GRPCRoute"
                      fi
                      if grep -qx 'kind: ExternalSecret' "${PREFLIGHT_RENDER}"; then
                        require_api external-secrets.io/v1 externalsecrets "ExternalSecret"
                      fi
                      # HPA → metrics.k8s.io; PVC → StorageClass + CSI (render-driven).
                      if ! bash "${TEMPLATES_DIR}/scripts/preflight-deploy-target.sh" capabilities \
                           --render "${PREFLIGHT_RENDER}"; then
                        echo "##vso[task.logissue type=error]Cluster capability preflight failed — deployment refused before helm upgrade"
                        exit 1
                      fi

                      # Gateway presence: read parentRefs from the rendered route (what we will apply),
                      # not a parallel bash map of env → name.
                      if grep -qE '^kind: (HTTPRoute|GRPCRoute)$' "${PREFLIGHT_RENDER}"; then
                        # eval-all (ea): multi-doc render; plain `yq` can emit leading blank lines per doc.
                        # Capture yq fully before awk exits — yq|awk-exit under pipefail is SIGPIPE (141).
                        ROUTE_GW_NAME_LINES="$(yq ea -r 'select(.kind == "HTTPRoute" or .kind == "GRPCRoute") | .spec.parentRefs[0].name // ""' "${PREFLIGHT_RENDER}")"
                        ROUTE_GW_NS_LINES="$(yq ea -r 'select(.kind == "HTTPRoute" or .kind == "GRPCRoute") | .spec.parentRefs[0].namespace // ""' "${PREFLIGHT_RENDER}")"
                        ROUTE_GW_NAME="$(awk 'NF{print; exit}' <<< "${ROUTE_GW_NAME_LINES}")"
                        ROUTE_GW_NS="$(awk 'NF{print; exit}' <<< "${ROUTE_GW_NS_LINES}")"
                        if [[ -z "${ROUTE_GW_NAME}" ]]; then
                          echo "##vso[task.logissue type=error]Rendered route has empty parentRefs[0].name"
                          exit 1
                        fi
                        GW_FOUND=""
                        if [[ -n "${ROUTE_GW_NS}" ]]; then
                          GW_FOUND="$(kubectl get gateway.gateway.networking.k8s.io "${ROUTE_GW_NAME}" -n "${ROUTE_GW_NS}" -o jsonpath='{.metadata.name}' 2>/dev/null || true)"
                        fi
                        if [[ -z "${GW_FOUND}" ]]; then
                          GW_FOUND="$(kubectl get gateway.gateway.networking.k8s.io -A -o json 2>/dev/null \
                            | yq -r "[.items[] | select(.metadata.name == \"${ROUTE_GW_NAME}\") | .metadata.name] | map(select(. != null and . != \"\")) | .[0] // \"\"" 2>/dev/null || true)"
                        fi
                        if [[ -z "${GW_FOUND}" ]]; then
                          echo "##vso[task.logissue type=error]Expected Gateway '${ROUTE_GW_NAME}' not found in cluster${ROUTE_GW_NS:+ (ns ${ROUTE_GW_NS})}"
                          exit 1
                        fi
                        echo "Gateway ${ROUTE_GW_NAME} present${ROUTE_GW_NS:+ in ${ROUTE_GW_NS}} (from rendered route)"
                      fi

                      if [[ "${KIND}" == "Application" ]]; then
                        WT="$(yq -r '.workload.type // ""' "${MANIFEST}")"
                      fi
                      rm -f "${PREFLIGHT_RENDER}" "${PREFLIGHT_RENDER}.err"
                      PREFLIGHT_RENDER=""
                      echo "##[endgroup]"

                      helm_has_deployed_revision() {
                        helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json 2>/dev/null \
                          | yq -r '[.[] | select(.status == "deployed")] | length' 2>/dev/null \
                          | grep -Eq '^[1-9]'
                      }

                      helm_rollback_to_last_deployed() {
                        local rev
                        # mikefarah/yq: use .[-1], not jq's `last`
                        rev="$(helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json \
                          | yq -r '[.[] | select(.status == "deployed")] | .[-1].revision // ""')"
                        if [[ -z "${rev}" || "${rev}" == "null" ]]; then
                          echo "##vso[task.logissue type=error]No deployed revision available for rollback"
                          return 1
                        fi
                        echo "Rolling back to deployed revision ${rev}"
                        helm rollback "${HELM_RELEASE}" "${rev}" -n "${HELM_NAMESPACE}" --wait --timeout "${HELM_TIMEOUT}"
                      }

                      echo "##[group]helm pre-upgrade recovery (stuck prior run)"
                      if helm status "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" >/dev/null 2>&1; then
                        STATUS="$(helm status "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json | yq -r '.info.status // ""')"
                        echo "current release status: ${STATUS}"
                        case "${STATUS}" in
                          pending-install)
                            dump_diagnostics
                            if helm_has_deployed_revision; then
                              echo "##vso[task.logissue type=error]pending-install but history has deployed revision — refusing uninstall; manual intervention required"
                              exit 1
                            fi
                            echo "No deployed revision — uninstalling incomplete first install"
                            helm uninstall "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" --wait --timeout 2m
                            ;;
                          pending-upgrade|pending-rollback|failed)
                            dump_diagnostics
                            if ! helm_rollback_to_last_deployed; then
                              echo "##vso[task.logissue type=error]Recovery rollback failed for ${STATUS} — refusing uninstall"
                              exit 1
                            fi
                            ;;
                          deployed|superseded)
                            echo "release healthy enough to proceed (${STATUS})"
                            ;;
                          *)
                            echo "##[warning]Unhandled helm status '${STATUS}' — proceeding cautiously"
                            ;;
                        esac
                      else
                        echo "no existing release"
                      fi
                      echo "##[endgroup]"

                      echo "kind=${KIND} → chart=${CHART_DIR}"
                      HELM_SET=(
                        --set-string "image.repository=${IMAGE_REPOSITORY}"
                        --set-string "image.tag=${IMAGE_TAG}"
                      )
                      # Same resolved facts the DeployContract stage injects (area/tier labels, gateway, DNS).
                      # Precedence: runtime defaults < manifesto < platform facts.
                      HELM_VALUE_FILES=(
                        -f "${RUNTIME_VALUES}"
                        -f "${MANIFEST}"
                        -f "${PLATFORM_VALUES}"
                      )

                      # Runtime image pull is infrastructure-owned (node/kubelet + shared ECR
                      # repository policy). The pipeline never creates imagePullSecrets.
                      echo "imagePullSecrets: none (node/kubelet ECR access required)"

                      echo "##[group]helm upgrade ${HELM_RELEASE} → ${IMAGE_REPOSITORY}:${IMAGE_TAG}"
                      set +e
                      helm upgrade --install "${HELM_RELEASE}" "${CHART_DIR}" \
                        --namespace "${HELM_NAMESPACE}" \
                        --reset-values \
                        "${HELM_VALUE_FILES[@]}" \
                        "${HELM_SET[@]}" \
                        --wait \
                        --timeout "${HELM_TIMEOUT}"
                      HELM_RC=$?
                      set -e
                      if [[ "${HELM_RC}" -ne 0 ]]; then
                        echo "##vso[task.logissue type=error]helm upgrade failed (exit ${HELM_RC})"
                        dump_diagnostics
                        if helm_has_deployed_revision; then
                          echo "Attempting rollback to last deployed revision after failed upgrade"
                          if ! helm_rollback_to_last_deployed; then
                            echo "##vso[task.logissue type=error]Rollback after failed upgrade also failed — refusing uninstall"
                          fi
                        else
                          echo "First install failure — preserving failed release for diagnostics (no automatic uninstall)"
                        fi
                        exit 1
                      fi
                      echo "##[endgroup]"

                      echo "##[group]helm history"
                      helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" || true
                      echo "##[endgroup]"

                      kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,pdb,sa,httproute,grpcroute,externalsecret,configmap,pvc,cronjob,pods \
                        -l "app.kubernetes.io/name=${HELM_RELEASE}" -o wide 2>/dev/null \
                        || kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,sa,httproute,grpcroute,cronjob,pods -o wide

                      wait_route_parents() {
                        local kind="$1" name="$2" deadline=$((SECONDS + 120))
                        echo "Waiting for ${kind}/${name} parents Accepted=True ResolvedRefs=True"
                        while (( SECONDS < deadline )); do
                          local json ok
                          json="$(kubectl -n "${HELM_NAMESPACE}" get "${kind}" "${name}" -o json 2>/dev/null || true)"
                          if [[ -n "${json}" ]]; then
                            ok="$(printf '%s' "${json}" | yq -r '
                              .status.parents // []
                              | map(select(
                                  (.conditions // [])
                                  | map(select(.type=="Accepted" and .status=="True")) | length > 0
                                )
                                and
                                (
                                  (.conditions // [])
                                  | map(select(.type=="ResolvedRefs" and .status=="True")) | length > 0
                                ))
                              | length > 0
                            ')"
                            if [[ "${ok}" == "true" ]]; then
                              echo "${kind}/${name} Accepted+ResolvedRefs"
                              return 0
                            fi
                          fi
                          sleep 5
                        done
                        echo "##vso[task.logissue type=error]${kind}/${name} did not become Accepted+ResolvedRefs"
                        kubectl -n "${HELM_NAMESPACE}" get "${kind}" "${name}" -o yaml || true
                        return 1
                      }

                      if [[ "${KIND}" == "Application" && ( "${WT}" == "web" || "${WT}" == "grpc" ) ]]; then
                        echo "##[group]route readiness"
                        if [[ "${WT}" == "web" ]]; then
                          wait_route_parents httproute "${HELM_RELEASE}"
                        else
                          wait_route_parents grpcroute "${HELM_RELEASE}"
                        fi
                        echo "##[endgroup]"
                      fi

                      # Platform policy: smokeAllowed on the tier + ScheduledJob → one-off Job.
                      case "${SMOKE_ALLOWED}" in
                        true|True|TRUE)
                          if [[ "${KIND}" == "ScheduledJob" ]]; then
                            echo "##[group]ScheduledJob smoke"
                            SMOKE="smoke-${HELM_RELEASE}-${BUILD_BUILDID:-manual}"
                            kubectl -n "${HELM_NAMESPACE}" delete job "${SMOKE}" --ignore-not-found >/dev/null 2>&1 || true
                            kubectl -n "${HELM_NAMESPACE}" create job "${SMOKE}" --from="cronjob/${HELM_RELEASE}"
                            if kubectl -n "${HELM_NAMESPACE}" wait --for=condition=complete "job/${SMOKE}" --timeout=120s; then
                              echo "ScheduledJob smoke Complete"
                            elif kubectl -n "${HELM_NAMESPACE}" get job "${SMOKE}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null | grep -q True; then
                              echo "##vso[task.logissue type=error]ScheduledJob smoke Failed"
                              kubectl -n "${HELM_NAMESPACE}" describe job "${SMOKE}" || true
                              exit 1
                            else
                              echo "##vso[task.logissue type=error]ScheduledJob smoke Timeout"
                              kubectl -n "${HELM_NAMESPACE}" describe job "${SMOKE}" || true
                              exit 1
                            fi
                            echo "##[endgroup]"
                          fi
                          ;;
                      esac

