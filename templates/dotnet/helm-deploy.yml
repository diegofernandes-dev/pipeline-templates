# Stage reutilizável: Helm deploy em um Environment ADO.
# Namespace: asa-<applicationName> (sem sufixo; mesmo nome em cada cluster).
parameters:
  - name: environmentName
    type: string

  - name: variableGroups
    type: object
    default: []

  - name: dependsOn
    type: object
    default:
      - Container

  - name: applicationName
    type: string

  - name: containerPool
    type: string
    default: 'PG-AWS-EKS'

  - name: awsRegion
    type: string
    default: 'us-east-1'

  - name: helmTimeout
    type: string
    default: '5m'

  - name: exposeAsaComBr
    type: boolean
    default: false

stages:
  - stage: Deploy_${{ parameters.environmentName }}
    displayName: Deploy ${{ parameters.environmentName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    variables:
      - name: imageRepository
        value: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageRepository'] ]
      - name: imageTag
        value: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageTag'] ]
      - ${{ each vg in parameters.variableGroups }}:
        - group: ${{ vg }}
    jobs:
      - deployment: Helm_${{ parameters.environmentName }}
        displayName: Helm upgrade (${{ parameters.environmentName }})
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.containerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                # Deploy needs chart + image refs only — not the CI publish artifact.
                - download: none

                - checkout: templates
                  displayName: Checkout chart
                  path: pipeline-templates

                - task: Bash@3
                  displayName: helm upgrade --install
                  env:
                    APPLICATION_NAME: ${{ parameters.applicationName }}
                    ADO_ENVIRONMENT: ${{ parameters.environmentName }}
                    HELM_TIMEOUT: ${{ parameters.helmTimeout }}
                    EXPOSE_ASA_COM_BR: ${{ parameters.exposeAsaComBr }}
                    AWS_REGION: ${{ parameters.awsRegion }}
                    AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                    IMAGE_REPOSITORY: $(imageRepository)
                    IMAGE_TAG: $(imageTag)
                    # ECR_PULL_SECRET: optional pipeline variable only (do not map $(ECR_PULL_SECRET) here —
                    # an unset macro becomes the literal string and would force a bogus imagePullSecret).
                    # Identity vars: secrets require explicit env mapping in ADO; absent vars become literal
                    # $(VAR) and are cleared by the script guard before opt-in logic runs.
                    SA_ROLE_ARN: $(SA_ROLE_ARN)
                    WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME: $(WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME)
                    WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON: $(WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON)
                    WORKLOAD_IDENTITY_GCP_PROJECT_ID: $(WORKLOAD_IDENTITY_GCP_PROJECT_ID)
                    WORKLOAD_IDENTITY_AUDIENCE: $(WORKLOAD_IDENTITY_AUDIENCE)
                  inputs:
                    targetType: inline
                    script: |
                      set -Eeuo pipefail

                      case "${ADO_ENVIRONMENT}" in
                        develop|homolog|production) ;;
                        *)
                          echo "##vso[task.logissue type=error]Unsupported environment '${ADO_ENVIRONMENT}' (allowed: develop, homolog, production)"
                          exit 1
                          ;;
                      esac

                      if [[ -z "${APPLICATION_NAME:-}" ]]; then
                        echo "##vso[task.logissue type=error]applicationName is required when deployEnvironments is set"
                        exit 1
                      fi

                      HELM_RELEASE="${APPLICATION_NAME}"
                      # Same namespace name in every cluster (no env suffix).
                      HELM_NAMESPACE="asa-${APPLICATION_NAME}"

                      WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                      CHART_DIR="${WORKSPACE}/pipeline-templates/charts/app"

                      if [[ ! -f "${CHART_DIR}/Chart.yaml" ]]; then
                        echo "##vso[task.logissue type=error]Chart not found: ${CHART_DIR}"
                        exit 1
                      fi

                      if [[ -z "${IMAGE_REPOSITORY:-}" || -z "${IMAGE_TAG:-}" ]]; then
                        echo "##vso[task.logissue type=error]imageRepository/imageTag missing from Container stage"
                        exit 1
                      fi

                      echo "##[group]ensure namespace ${HELM_NAMESPACE}"
                      kubectl create namespace "${HELM_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
                      echo "##[endgroup]"

                      # Optional identity from Variable Groups — read from job env only (never map
                      # $(VAR) in task env:; unset macros become literal strings).
                      SA_ROLE_ARN="${SA_ROLE_ARN:-}"
                      WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME="${WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME:-}"
                      WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON="${WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON:-}"
                      WORKLOAD_IDENTITY_GCP_PROJECT_ID="${WORKLOAD_IDENTITY_GCP_PROJECT_ID:-}"
                      WORKLOAD_IDENTITY_AUDIENCE="${WORKLOAD_IDENTITY_AUDIENCE:-}"
                      [[ "$SA_ROLE_ARN" == '$('*')' ]] && SA_ROLE_ARN=""
                      [[ "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME" == '$('*')' ]] && WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME=""
                      [[ "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON" == '$('*')' ]] && WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON=""
                      [[ "$WORKLOAD_IDENTITY_GCP_PROJECT_ID" == '$('*')' ]] && WORKLOAD_IDENTITY_GCP_PROJECT_ID=""
                      [[ "$WORKLOAD_IDENTITY_AUDIENCE" == '$('*')' ]] && WORKLOAD_IDENTITY_AUDIENCE=""

                      echo "##[group]aws caller identity (ambient credentials on agent)"
                      aws sts get-caller-identity
                      echo "##[endgroup]"

                      EXPOSE_FLAG="false"
                      if [[ "${EXPOSE_ASA_COM_BR}" == "True" || "${EXPOSE_ASA_COM_BR}" == "true" ]]; then
                        EXPOSE_FLAG="true"
                      fi

                      HELM_SET=(
                        --set-string "image.repository=${IMAGE_REPOSITORY}"
                        --set-string "image.tag=${IMAGE_TAG}"
                        --set "httpRoute.exposeAsaComBr=${EXPOSE_FLAG}"
                        --set-string "httpRoute.environment=${ADO_ENVIRONMENT}"
                      )

                      # Default: no imagePullSecrets (cluster/node runtime must reach ECR).
                      # Optional lab: set pipeline variable ECR_PULL_SECRET to a pre-provisioned secret name.
                      if [[ -n "${ECR_PULL_SECRET:-}" ]]; then
                        HELM_SET+=(--set-string "imagePullSecrets[0].name=${ECR_PULL_SECRET}")
                        echo "Using pre-provisioned imagePullSecret: ${ECR_PULL_SECRET}"
                      else
                        echo "No imagePullSecret — cluster/node runtime must have ECR access"
                      fi

                      if [[ -n "$SA_ROLE_ARN" ]]; then
                        HELM_SET+=(--set-string "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${SA_ROLE_ARN}")
                        echo "ServiceAccount IRSA binding: eks.amazonaws.com/role-arn=${SA_ROLE_ARN}"
                      fi

                      if [[ -n "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON" || -n "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME" ]]; then
                        if [[ -n "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON" ]]; then
                          : "${WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME:=wif-gcp-credentials}"
                        fi
                        if [[ -z "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME" ]]; then
                          echo "##vso[task.logissue type=error]Set WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON or WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME for GCP WIF"
                          exit 1
                        fi
                        HELM_SET+=(--set workloadIdentity.enabled=true)
                        HELM_SET+=(--set-string "workloadIdentity.gcp.credentialsConfigMapName=${WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME}")
                        if [[ -n "$WORKLOAD_IDENTITY_AUDIENCE" ]]; then
                          HELM_SET+=(--set-string "workloadIdentity.token.audience=${WORKLOAD_IDENTITY_AUDIENCE}")
                        fi
                        if [[ -n "$WORKLOAD_IDENTITY_GCP_PROJECT_ID" ]]; then
                          HELM_SET+=(--set-string "workloadIdentity.gcp.projectId=${WORKLOAD_IDENTITY_GCP_PROJECT_ID}")
                        fi
                        echo "GCP Workload Identity Federation enabled (ConfigMap: ${WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME})"
                      fi

                      if [[ -n "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON" ]]; then
                        echo "##[group]apply GCP external_account ConfigMap ${WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME}"
                        _cm_tmp="$(mktemp)"
                        printf '%s' "$WORKLOAD_IDENTITY_GCP_CREDENTIALS_JSON" | base64 -d > "$_cm_tmp"
                        kubectl create configmap "${WORKLOAD_IDENTITY_GCP_CREDENTIALS_CM_NAME}" \
                          --namespace "${HELM_NAMESPACE}" \
                          --from-file=external-account.json="$_cm_tmp" \
                          --dry-run=client -o yaml | kubectl apply -f -
                        rm -f "$_cm_tmp"
                        echo "##[endgroup]"
                      fi

                      echo "##[group]helm upgrade ${HELM_RELEASE} → ${IMAGE_REPOSITORY}:${IMAGE_TAG} (${ADO_ENVIRONMENT})"
                      helm upgrade --install "${HELM_RELEASE}" "${CHART_DIR}" \
                        --namespace "${HELM_NAMESPACE}" \
                        --reset-values \
                        "${HELM_SET[@]}" \
                        --atomic \
                        --wait \
                        --timeout "${HELM_TIMEOUT}"
                      echo "##[endgroup]"

                      kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,pdb,sa,httproute,pods -l "app=${HELM_RELEASE}" -o wide
