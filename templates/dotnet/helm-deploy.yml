# Stage reutilizável: Helm deploy em um Environment ADO.
# Namespace: asa-<applicationName> (sem sufixo; mesmo nome em cada cluster).
# Manifesto obrigatório: deploy/config/<environment>.yaml com kind: Application|ScheduledJob.
# Chart path is resolved from kind (never exposed to the consumer).
#
# Operational requirement: Azure DevOps Environments used for deploy MUST enable
# exclusive lock / one deployment at a time per environment (no bash lock here).
parameters:
  - name: environmentName
    type: string

  - name: variableGroups
    type: object
    default: []

  - name: dependsOn
    type: object
    default:
      - Container

  - name: applicationName
    type: string

  - name: containerPool
    type: string
    default: 'PG-AWS-EKS'

  - name: awsRegion
    type: string
    default: 'us-east-1'

  - name: helmTimeout
    type: string
    default: '5m'

  - name: runtimeConfigPath
    type: string
    default: 'deploy/config'

  # Exact kubectl context name (not substring). Empty = skip (external blocker until mapped).
  - name: expectedKubeContext
    type: string
    default: ''

  # Lab fallback: docker-registry secret name (empty = rely on node/kubelet ECR IAM).
  - name: ecrPullSecret
    type: string
    default: ''

  # develop + ScheduledJob only: create a one-off Job from CronJob after deploy (opt-in).
  - name: smokeScheduledJob
    type: boolean
    default: false

stages:
  - stage: Deploy_${{ parameters.environmentName }}
    displayName: Deploy ${{ parameters.environmentName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    variables:
      - name: imageRepository
        value: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageRepository'] ]
      - name: imageTag
        value: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageTag'] ]
      - ${{ each vg in parameters.variableGroups }}:
        - group: ${{ vg }}
    jobs:
      - deployment: Helm_${{ parameters.environmentName }}
        displayName: Helm upgrade (${{ parameters.environmentName }})
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.containerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - checkout: self
                  displayName: Checkout app
                  path: app

                - checkout: templates
                  displayName: Checkout chart
                  path: pipeline-templates

                - task: Bash@3
                  displayName: helm upgrade --install
                  env:
                    APPLICATION_NAME: ${{ parameters.applicationName }}
                    ADO_ENVIRONMENT: ${{ parameters.environmentName }}
                    HELM_TIMEOUT: ${{ parameters.helmTimeout }}
                    AWS_REGION: ${{ parameters.awsRegion }}
                    AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                    IMAGE_REPOSITORY: $(imageRepository)
                    IMAGE_TAG: $(imageTag)
                    RUNTIME_CONFIG_PATH: ${{ parameters.runtimeConfigPath }}
                    EXPECTED_KUBE_CONTEXT: ${{ parameters.expectedKubeContext }}
                    SMOKE_SCHEDULED_JOB: ${{ parameters.smokeScheduledJob }}
                    # Prefer compile-time parameter — deployment jobs often leave $(ECR_PULL_SECRET) unresolved.
                    ECR_PULL_SECRET: ${{ parameters.ecrPullSecret }}
                  inputs:
                    targetType: inline
                    script: |
                      set -Eeuo pipefail

                      WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                      TEMPLATES_DIR="${WORKSPACE}/pipeline-templates"
                      APP_DIR="${WORKSPACE}/app"
                      MANIFEST="${APP_DIR}/${RUNTIME_CONFIG_PATH}/${ADO_ENVIRONMENT}.yaml"
                      HELM_RELEASE="${APPLICATION_NAME}"
                      HELM_NAMESPACE="asa-${APPLICATION_NAME}"
                      PLATFORM_ENVS="${TEMPLATES_DIR}/config/platform-environments.json"

                      # Empty / whitespace-only → unset (no lab pull secret).
                      ECR_PULL_SECRET="$(echo -n "${ECR_PULL_SECRET:-}" | tr -d "[:space:]")"

                      dump_diagnostics() {
                        echo "##[group]deploy diagnostics"
                        kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,pdb,sa,cronjob,pods,httproute,grpcroute,externalsecret,configmap,pvc -o wide 2>/dev/null || true
                        kubectl -n "${HELM_NAMESPACE}" get events --sort-by=.lastTimestamp 2>/dev/null | tail -60 || true
                        for p in $(kubectl -n "${HELM_NAMESPACE}" get pods -o name 2>/dev/null || true); do
                          echo "--- describe ${p} ---"
                          kubectl -n "${HELM_NAMESPACE}" describe "${p}" 2>/dev/null | tail -100 || true
                          echo "--- logs ${p} ---"
                          kubectl -n "${HELM_NAMESPACE}" logs "${p}" --all-containers=true --tail=100 2>/dev/null || true
                        done
                        for r in httproute grpcroute; do
                          for obj in $(kubectl -n "${HELM_NAMESPACE}" get "${r}" -o name 2>/dev/null || true); do
                            echo "--- ${obj} status ---"
                            kubectl -n "${HELM_NAMESPACE}" get "${obj}" -o yaml 2>/dev/null | yq -r '.status // {}' || true
                          done
                        done
                        helm status "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" 2>/dev/null || true
                        helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" 2>/dev/null || true
                        echo "##[endgroup]"
                      }

                      require_cmd() {
                        local c="$1"
                        if ! command -v "${c}" >/dev/null 2>&1; then
                          echo "##vso[task.logissue type=error]Required tool '${c}' not found on agent — install on the self-hosted pool (no ad-hoc download in deploy)"
                          exit 1
                        fi
                      }

                      require_cmd kubectl
                      require_cmd helm
                      require_cmd yq
                      require_cmd aws
                      require_cmd python3

                      HELM_V="$(helm version --short 2>/dev/null || true)"
                      echo "helm: ${HELM_V}"
                      if [[ ! "${HELM_V}" =~ ^v?3\. ]]; then
                        echo "##vso[task.logissue type=error]Unsupported Helm version '${HELM_V}' — platform requires Helm 3.x"
                        exit 1
                      fi

                      if ! python3 -c 'import yaml, jsonschema' >/dev/null 2>&1; then
                        echo "##vso[task.logissue type=error]Python packages PyYAML + jsonschema required on agent (pinned install on pool; no pip in deploy)"
                        exit 1
                      fi

                      case "${ADO_ENVIRONMENT}" in
                        develop|homolog|production) ;;
                        *)
                          echo "##vso[task.logissue type=error]Unsupported environment '${ADO_ENVIRONMENT}'"
                          exit 1
                          ;;
                      esac

                      if [[ -z "${APPLICATION_NAME:-}" ]]; then
                        echo "##vso[task.logissue type=error]applicationName is required"
                        exit 1
                      fi

                      if [[ ! -f "${MANIFEST}" ]]; then
                        echo "##vso[task.logissue type=error]Manifesto required at ${MANIFEST}"
                        exit 1
                      fi

                      CTX="$(kubectl config current-context 2>/dev/null || true)"
                      echo "kubectl context: ${CTX}"
                      if [[ -n "${EXPECTED_KUBE_CONTEXT:-}" ]]; then
                        if [[ "${CTX}" != "${EXPECTED_KUBE_CONTEXT}" ]]; then
                          echo "##vso[task.logissue type=error]kubectl context must equal expectedKubeContext '${EXPECTED_KUBE_CONTEXT}' (got '${CTX}') — exact match, no substring"
                          exit 1
                        fi
                      else
                        echo "##[warning]expectedKubeContext empty for ${ADO_ENVIRONMENT} — EXTERNAL BLOCKER until platform mapping is filled in config/platform-environments.json"
                      fi

                      KIND="$(yq -r '.kind // ""' "${MANIFEST}")"
                      case "${KIND}" in
                        Application)
                          CHART_DIR="${TEMPLATES_DIR}/charts/asa-application"
                          PUBLIC_SCHEMA="${TEMPLATES_DIR}/schemas/application.manifest.schema.json"
                          ;;
                        ScheduledJob)
                          CHART_DIR="${TEMPLATES_DIR}/charts/asa-scheduled-job"
                          PUBLIC_SCHEMA="${TEMPLATES_DIR}/schemas/scheduled-job.manifest.schema.json"
                          ;;
                        *)
                          echo "##vso[task.logissue type=error]Unsupported or missing kind '${KIND}'"
                          exit 1
                          ;;
                      esac

                      if [[ ! -f "${CHART_DIR}/Chart.yaml" ]]; then
                        echo "##vso[task.logissue type=error]Chart not found: ${CHART_DIR}"
                        exit 1
                      fi

                      if [[ -z "${IMAGE_REPOSITORY:-}" || -z "${IMAGE_TAG:-}" ]]; then
                        echo "##vso[task.logissue type=error]imageRepository/imageTag missing from Container stage"
                        exit 1
                      fi

                      echo "##[group]validate public manifesto schema"
                      python3 "${TEMPLATES_DIR}/scripts/validate-manifest.py" "${PUBLIC_SCHEMA}" "${MANIFEST}"
                      echo "##[endgroup]"

                      echo "##[group]ensure namespace ${HELM_NAMESPACE}"
                      kubectl create namespace "${HELM_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
                      kubectl label namespace "${HELM_NAMESPACE}" \
                        app.kubernetes.io/managed-by=pipeline-templates \
                        app.kubernetes.io/name="${HELM_RELEASE}" \
                        --overwrite >/dev/null
                      echo "##[endgroup]"

                      echo "##[group]aws caller identity"
                      aws sts get-caller-identity
                      echo "##[endgroup]"

                      WT=""
                      GATEWAY_NAME=""
                      GATEWAY_NAMESPACE=""
                      if [[ -f "${PLATFORM_ENVS}" ]]; then
                        GATEWAY_NAME="$(yq -r ".${ADO_ENVIRONMENT}.gatewayName // \"\"" "${PLATFORM_ENVS}")"
                        GATEWAY_NAMESPACE="$(yq -r ".${ADO_ENVIRONMENT}.gatewayNamespace // \"\"" "${PLATFORM_ENVS}")"
                      fi

                      echo "##[group]preflight APIs / CRDs / Gateway / metrics"
                      if [[ "${KIND}" == "Application" ]]; then
                        WT="$(yq -r '.workload.type // ""' "${MANIFEST}")"
                        case "${WT}" in
                          web)
                            kubectl api-resources --api-group=gateway.networking.k8s.io -o name 2>/dev/null | grep -qx httproutes.gateway.networking.k8s.io \
                              || { echo "##vso[task.logissue type=error]HTTPRoute API not available"; exit 1; }
                            ;;
                          grpc)
                            kubectl api-resources --api-group=gateway.networking.k8s.io -o name 2>/dev/null | grep -qx grpcroutes.gateway.networking.k8s.io \
                              || { echo "##vso[task.logissue type=error]GRPCRoute API not available"; exit 1; }
                            ;;
                        esac
                        if [[ "${WT}" == "web" || "${WT}" == "grpc" ]]; then
                          if [[ -n "${GATEWAY_NAME}" ]]; then
                            # mikefarah/yq has no jq --arg; match name with string equality.
                            # Prefer namespaced get (matches chart parentRef + avoids cluster-wide list RBAC).
                            GW_FOUND=""
                            if [[ -n "${GATEWAY_NAMESPACE}" ]]; then
                              GW_FOUND="$(kubectl get gateway.gateway.networking.k8s.io "${GATEWAY_NAME}" -n "${GATEWAY_NAMESPACE}" -o jsonpath='{.metadata.name}' 2>/dev/null || true)"
                            fi
                            if [[ -z "${GW_FOUND}" ]]; then
                              GW_FOUND="$(kubectl get gateway.gateway.networking.k8s.io -A -o json 2>/dev/null \
                                | yq -r ".items[] | select(.metadata.name == \"${GATEWAY_NAME}\") | .metadata.name" 2>/dev/null \
                                | head -n1 || true)"
                            fi
                            if [[ -z "${GW_FOUND}" ]]; then
                              echo "##vso[task.logissue type=error]Expected Gateway '${GATEWAY_NAME}' not found in cluster${GATEWAY_NAMESPACE:+ (ns ${GATEWAY_NAMESPACE})}"
                              exit 1
                            fi
                            echo "Gateway ${GATEWAY_NAME} present${GATEWAY_NAMESPACE:+ in ${GATEWAY_NAMESPACE}}"
                          else
                            echo "##[warning]gatewayName unset for ${ADO_ENVIRONMENT}"
                          fi
                        fi

                        # HPA active? (mirrors chart.autoscalingEnabled defaults)
                        AS_JSON="$(yq -o=json '.autoscaling // null' "${MANIFEST}")"
                        HPA_NEEDED=false
                        if [[ "${WT}" == "web" || "${WT}" == "grpc" ]]; then
                          if [[ "${AS_JSON}" == "false" ]]; then
                            HPA_NEEDED=false
                          else
                            HPA_NEEDED=true
                          fi
                        elif [[ "${WT}" == "worker" ]]; then
                          if [[ "${AS_JSON}" != "null" && "${AS_JSON}" != "false" && "${AS_JSON}" != "{}" ]]; then
                            HPA_NEEDED=true
                          fi
                        fi
                        if [[ "${HPA_NEEDED}" == "true" ]]; then
                          kubectl get --raw /apis/metrics.k8s.io/v1beta1 >/dev/null 2>&1 \
                            || { echo "##vso[task.logissue type=error]metrics.k8s.io unavailable but HPA will be rendered"; exit 1; }
                          echo "metrics.k8s.io available"
                        fi
                      fi
                      ES_NAME="$(yq -r '.externalSecret.secretStoreRef.name // ""' "${MANIFEST}")"
                      ES_LEN="$(yq -r '.externalSecret.data | length' "${MANIFEST}")"
                      if [[ -n "${ES_NAME}" && "${ES_LEN}" != "0" && "${ES_LEN}" != "null" ]]; then
                        kubectl api-resources --api-group=external-secrets.io >/dev/null \
                          || { echo "##vso[task.logissue type=error]external-secrets.io APIs missing"; exit 1; }
                      fi
                      echo "##[endgroup]"

                      helm_has_deployed_revision() {
                        helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json 2>/dev/null \
                          | yq -r '[.[] | select(.status == "deployed")] | length' 2>/dev/null \
                          | grep -Eq '^[1-9]'
                      }

                      helm_rollback_to_last_deployed() {
                        local rev
                        # mikefarah/yq: use .[-1], not jq's `last`
                        rev="$(helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json \
                          | yq -r '[.[] | select(.status == "deployed")] | .[-1].revision // ""')"
                        if [[ -z "${rev}" || "${rev}" == "null" ]]; then
                          echo "##vso[task.logissue type=error]No deployed revision available for rollback"
                          return 1
                        fi
                        echo "Rolling back to deployed revision ${rev}"
                        helm rollback "${HELM_RELEASE}" "${rev}" -n "${HELM_NAMESPACE}" --wait --timeout "${HELM_TIMEOUT}"
                      }

                      echo "##[group]helm pre-upgrade recovery (stuck prior run)"
                      if helm status "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" >/dev/null 2>&1; then
                        STATUS="$(helm status "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json | yq -r '.info.status // ""')"
                        echo "current release status: ${STATUS}"
                        case "${STATUS}" in
                          pending-install)
                            dump_diagnostics
                            if helm_has_deployed_revision; then
                              echo "##vso[task.logissue type=error]pending-install but history has deployed revision — refusing uninstall; manual intervention required"
                              exit 1
                            fi
                            echo "No deployed revision — uninstalling incomplete first install"
                            helm uninstall "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" --wait --timeout 2m
                            ;;
                          pending-upgrade|pending-rollback|failed)
                            dump_diagnostics
                            if ! helm_rollback_to_last_deployed; then
                              echo "##vso[task.logissue type=error]Recovery rollback failed for ${STATUS} — refusing uninstall"
                              exit 1
                            fi
                            ;;
                          deployed|superseded)
                            echo "release healthy enough to proceed (${STATUS})"
                            ;;
                          *)
                            echo "##[warning]Unhandled helm status '${STATUS}' — proceeding cautiously"
                            ;;
                        esac
                      else
                        echo "no existing release"
                      fi
                      echo "##[endgroup]"

                      echo "kind=${KIND} → chart=${CHART_DIR}"
                      HELM_SET=(
                        --set-string "image.repository=${IMAGE_REPOSITORY}"
                        --set-string "image.tag=${IMAGE_TAG}"
                      )
                      if [[ "${KIND}" == "Application" ]]; then
                        HELM_SET+=(--set-string "runtime.environment=${ADO_ENVIRONMENT}")
                      fi

                      if [[ -n "${ECR_PULL_SECRET:-}" ]]; then
                        echo "##[group]refresh imagePullSecret ${ECR_PULL_SECRET}"
                        # ECR authorization tokens expire (~12h). Lab path depends on this secret;
                        # recreate every deploy so ImagePullBackOff is not caused by a stale token.
                        AWS_REGION_EFF="${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}"
                        ECR_HOST="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION_EFF}.amazonaws.com"
                        ECR_PASS="$(aws ecr get-login-password --region "${AWS_REGION_EFF}")"
                        kubectl -n "${HELM_NAMESPACE}" create secret docker-registry "${ECR_PULL_SECRET}" \
                          --docker-server="${ECR_HOST}" \
                          --docker-username=AWS \
                          --docker-password="${ECR_PASS}" \
                          --dry-run=client -o yaml | kubectl apply -f -
                        HELM_SET+=(--set-string "imagePullSecrets[0].name=${ECR_PULL_SECRET}")
                        echo "Using imagePullSecret: ${ECR_PULL_SECRET} (lab fallback; prefer node IAM)"
                        echo "##[endgroup]"
                      else
                        echo "No imagePullSecret — node/kubelet ECR access required"
                      fi

                      echo "##[group]helm upgrade ${HELM_RELEASE} → ${IMAGE_REPOSITORY}:${IMAGE_TAG}"
                      set +e
                      helm upgrade --install "${HELM_RELEASE}" "${CHART_DIR}" \
                        --namespace "${HELM_NAMESPACE}" \
                        --reset-values \
                        -f "${MANIFEST}" \
                        "${HELM_SET[@]}" \
                        --wait \
                        --timeout "${HELM_TIMEOUT}"
                      HELM_RC=$?
                      set -e
                      if [[ "${HELM_RC}" -ne 0 ]]; then
                        echo "##vso[task.logissue type=error]helm upgrade failed (exit ${HELM_RC})"
                        dump_diagnostics
                        if helm_has_deployed_revision; then
                          echo "Attempting rollback to last deployed revision after failed upgrade"
                          if ! helm_rollback_to_last_deployed; then
                            echo "##vso[task.logissue type=error]Rollback after failed upgrade also failed — refusing uninstall"
                          fi
                        else
                          echo "First install failure — preserving failed release for diagnostics (no automatic uninstall)"
                        fi
                        exit 1
                      fi
                      echo "##[endgroup]"

                      echo "##[group]helm history"
                      helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" || true
                      echo "##[endgroup]"

                      kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,pdb,sa,httproute,grpcroute,externalsecret,configmap,pvc,cronjob,pods \
                        -l "app.kubernetes.io/name=${HELM_RELEASE}" -o wide 2>/dev/null \
                        || kubectl -n "${HELM_NAMESPACE}" get deploy,svc,hpa,sa,httproute,grpcroute,cronjob,pods -o wide

                      wait_route_parents() {
                        local kind="$1" name="$2" deadline=$((SECONDS + 120))
                        echo "Waiting for ${kind}/${name} parents Accepted=True ResolvedRefs=True"
                        while (( SECONDS < deadline )); do
                          local json ok
                          json="$(kubectl -n "${HELM_NAMESPACE}" get "${kind}" "${name}" -o json 2>/dev/null || true)"
                          if [[ -n "${json}" ]]; then
                            ok="$(printf '%s' "${json}" | yq -r '
                              .status.parents // []
                              | map(select(
                                  (.conditions // [])
                                  | map(select(.type=="Accepted" and .status=="True")) | length > 0
                                )
                                and
                                (
                                  (.conditions // [])
                                  | map(select(.type=="ResolvedRefs" and .status=="True")) | length > 0
                                ))
                              | length > 0
                            ')"
                            if [[ "${ok}" == "true" ]]; then
                              echo "${kind}/${name} Accepted+ResolvedRefs"
                              return 0
                            fi
                          fi
                          sleep 5
                        done
                        echo "##vso[task.logissue type=error]${kind}/${name} did not become Accepted+ResolvedRefs"
                        kubectl -n "${HELM_NAMESPACE}" get "${kind}" "${name}" -o yaml || true
                        return 1
                      }

                      if [[ "${KIND}" == "Application" && ( "${WT}" == "web" || "${WT}" == "grpc" ) ]]; then
                        echo "##[group]route readiness"
                        if [[ "${WT}" == "web" ]]; then
                          wait_route_parents httproute "${HELM_RELEASE}"
                        else
                          wait_route_parents grpcroute "${HELM_RELEASE}"
                        fi
                        echo "##[endgroup]"
                      fi

                      SMOKE_ON=false
                      case "${SMOKE_SCHEDULED_JOB}" in
                        True|true|TRUE|1) SMOKE_ON=true ;;
                      esac
                      if [[ "${SMOKE_ON}" == "true" ]]; then
                        if [[ "${KIND}" != "ScheduledJob" ]]; then
                          echo "##vso[task.logissue type=error]smokeScheduledJob only valid for ScheduledJob"
                          exit 1
                        fi
                        if [[ "${ADO_ENVIRONMENT}" != "develop" ]]; then
                          echo "##vso[task.logissue type=error]smokeScheduledJob only allowed on develop"
                          exit 1
                        fi
                        echo "##[group]ScheduledJob smoke"
                        SMOKE="smoke-${HELM_RELEASE}-${BUILD_BUILDID:-manual}"
                        kubectl -n "${HELM_NAMESPACE}" delete job "${SMOKE}" --ignore-not-found >/dev/null 2>&1 || true
                        kubectl -n "${HELM_NAMESPACE}" create job "${SMOKE}" --from="cronjob/${HELM_RELEASE}"
                        if kubectl -n "${HELM_NAMESPACE}" wait --for=condition=complete "job/${SMOKE}" --timeout=120s; then
                          echo "ScheduledJob smoke Complete"
                        elif kubectl -n "${HELM_NAMESPACE}" get job "${SMOKE}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null | grep -q True; then
                          echo "##vso[task.logissue type=error]ScheduledJob smoke Failed"
                          kubectl -n "${HELM_NAMESPACE}" describe job "${SMOKE}" || true
                          exit 1
                        else
                          echo "##vso[task.logissue type=error]ScheduledJob smoke Timeout"
                          kubectl -n "${HELM_NAMESPACE}" describe job "${SMOKE}" || true
                          exit 1
                        fi
                        echo "##[endgroup]"
                      fi
