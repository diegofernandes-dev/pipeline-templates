# Template de CI para aplicações .NET 10 (restore → build → test → imagem ECR).
# Consumir via extends a partir de outro repositório.
parameters:
  - name: solution
    displayName: Caminho do .sln ou .csproj
    type: string
    default: '**/*.sln'

  - name: buildConfiguration
    displayName: Configuração de build
    type: string
    default: 'Release'

  - name: vmImage
    displayName: Imagem do agent Microsoft-hosted (stage CI)
    type: string
    default: 'ubuntu-latest'

  - name: dotnetVersion
    displayName: Versão do SDK .NET
    type: string
    default: '10.x'

  # SDKs extras (ex.: ['8.x']) quando o TFM dos testes é mais antigo que o SDK principal.
  # Preferir SDK (não só runtime) para incluir Microsoft.AspNetCore.App.
  - name: additionalSdkVersions
    displayName: SDKs .NET adicionais
    type: object
    default: []

  - name: buildImage
    displayName: Build e push da imagem Docker para o ECR
    type: boolean
    default: false

  - name: containerPool
    displayName: Agent pool com Docker + acesso ao ECR
    type: string
    default: 'PG-AWS-EKS'

  - name: awsAccountId
    displayName: Conta AWS do registry ECR
    type: string
    default: '448003890252'

  - name: awsRegion
    displayName: Região do ECR
    type: string
    default: 'us-east-1'

  - name: ecrRepository
    displayName: Nome do repositório ECR (ex. sample-api)
    type: string
    default: ''

  - name: dockerfile
    displayName: Caminho do Dockerfile
    type: string
    default: 'Dockerfile'

  - name: dockerContext
    displayName: Contexto do docker build
    type: string
    default: '.'

stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Restore, Build and Test
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK ${{ parameters.dotnetVersion }}
            inputs:
              packageType: sdk
              version: ${{ parameters.dotnetVersion }}

          - ${{ each sdk in parameters.additionalSdkVersions }}:
            - task: UseDotNet@2
              displayName: Install .NET SDK ${{ sdk }}
              inputs:
                packageType: sdk
                version: ${{ sdk }}

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: ${{ parameters.solution }}

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-build --logger trx
              publishTestResults: true

  - ${{ if eq(parameters.buildImage, true) }}:
    - stage: Container
      displayName: Docker Build and Push
      dependsOn: CI
      condition: succeeded()
      jobs:
        - job: DockerBuildPush
          displayName: Build and push image to ECR
          pool:
            name: ${{ parameters.containerPool }}
          steps:
            - checkout: self

            - task: Bash@3
              name: dockerBuildPush
              displayName: ECR login, docker build and push
              env:
                AWS_REGION: ${{ parameters.awsRegion }}
                AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                AWS_ACCOUNT_ID: ${{ parameters.awsAccountId }}
                ECR_REPOSITORY: ${{ parameters.ecrRepository }}
                DOCKERFILE: ${{ parameters.dockerfile }}
                DOCKER_CONTEXT: ${{ parameters.dockerContext }}
                IMAGE_TAG: $(Build.SourceVersion)
              inputs:
                targetType: inline
                script: |
                  set -Eeuo pipefail
                  cd "${BUILD_SOURCESDIRECTORY}"

                  if [[ -z "${ECR_REPOSITORY:-}" ]]; then
                    echo "##vso[task.logissue type=error]ecrRepository is required when buildImage=true"
                    exit 1
                  fi

                  if [[ ! -f "${DOCKERFILE}" ]]; then
                    echo "##vso[task.logissue type=error]Dockerfile not found: ${DOCKERFILE}"
                    exit 1
                  fi

                  echo "##[group]aws caller identity (ambient credentials on agent)"
                  aws sts get-caller-identity
                  echo "##[endgroup]"

                  REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  IMAGE_REF="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

                  echo "##[group]ecr login ${REGISTRY}"
                  aws ecr get-login-password --region "${AWS_REGION}" \
                    | docker login --username AWS --password-stdin "${REGISTRY}"
                  echo "##[endgroup]"

                  echo "##[group]ensure ecr repository ${ECR_REPOSITORY}"
                  if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null 2>&1; then
                    aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null
                    echo "Created repository ${ECR_REPOSITORY}"
                  else
                    echo "Repository ${ECR_REPOSITORY} already exists"
                  fi
                  echo "##[endgroup]"

                  echo "##[group]docker build ${IMAGE_REF}"
                  docker build -f "${DOCKERFILE}" -t "${IMAGE_REF}" "${DOCKER_CONTEXT}"
                  echo "##[endgroup]"

                  echo "##[group]docker push ${IMAGE_REF}"
                  docker push "${IMAGE_REF}"
                  echo "##[endgroup]"

                  echo "##vso[task.setvariable variable=imageRef;isOutput=true]${IMAGE_REF}"
                  echo "##vso[task.setvariable variable=imageTag;isOutput=true]${IMAGE_TAG}"
                  echo "Pushed ${IMAGE_REF}"
