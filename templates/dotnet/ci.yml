# Template de CI/.NET → ECR (+ entrega).
# Consumir via extends a partir de outro repositório.
#
# deliveryMode decide o que existe DEPOIS do push no ECR:
#
#   helm   (default, caminho atual) CI → DeployContract → Container → Deploy_<env> (helm upgrade)
#   gitops (pivot Kargo/Argo)       CI → GitOpsContract → Container → fim.
#                                   O lifecycle do artefato depois do ECR é do Kargo:
#                                   Warehouse → Freight → Stage develop → Stage homolog → Argo CD.
#
# Em gitops mode o consumidor não escolhe infraestrutura: deployEnvironments,
# expectedKubeContext e variableGroups são rejeitados (fail-fast), não ignorados.
parameters:
  - name: solution
    displayName: Caminho do .sln ou .csproj
    type: string
    default: '**/*.sln'

  - name: buildConfiguration
    displayName: Configuração de build
    type: string
    default: 'Release'

  - name: vmImage
    displayName: Imagem do agent Microsoft-hosted (stage CI)
    type: string
    default: 'ubuntu-latest'

  - name: dotnetVersion
    displayName: Versão do SDK .NET
    type: string
    default: '10.x'

  # SDKs extras (ex.: ['8.x']) quando o TFM dos testes é mais antigo que o SDK principal.
  # Preferir SDK (não só runtime) para incluir Microsoft.AspNetCore.App.
  - name: additionalSdkVersions
    displayName: SDKs .NET adicionais
    type: object
    default: []

  # Identidade única da aplicação. Deriva: ECR repository, Helm release e namespace asa-<name>
  # (mesmo nome de namespace em cada cluster; sem sufixo de ambiente).
  - name: applicationName
    displayName: Nome da aplicação (identidade única)
    type: string
    default: ''

  # Lista ordenada de ambientes para promover a mesma imagem.
  # Ex.: [{ name: homolog, containerPool: PG-AWS-EKS-HML, variableGroups: [] }]
  # name ∈ { develop, homolog, production }.
  # containerPool (opcional): pool do Deploy desse ambiente; default = parâmetro containerPool.
  # App env overlay: deploy/config/<name>.yaml no repo da app (IRSA, WIF, HPA, config, externalSecret).
  # variableGroups: legado/opcional (não alimenta IRSA/WIF/config de app). Lista vazia ⇒ só CI se deployEnvironments vazio.
  - name: deployEnvironments
    displayName: Ambientes ADO (+ pool por ambiente)
    type: object
    default: []

  - name: containerPool
    displayName: Agent pool com Docker + acesso ao ECR
    type: string
    default: 'PG-AWS-EKS'

  - name: awsRegion
    displayName: Região do ECR
    type: string
    default: 'us-east-1'

  # Path do .csproj a publicar na imagem (obrigatório quando há Container).
  - name: dotnetProject
    displayName: Caminho do .csproj da aplicação
    type: string
    default: ''

  - name: helmTimeout
    displayName: Timeout do helm upgrade --wait
    type: string
    default: '5m'

  # Pasta no repo da app com overlays <environment>.yaml (default: deploy/config).
  # Cada manifesto deve declarar kind: Application | ScheduledJob.
  - name: runtimeConfigPath
    displayName: Caminho dos manifestos por ambiente
    type: string
    default: 'deploy/config'

  # Optional substring that must appear in kubectl current-context (per-env override via deployEnvironments[].expectedKubeContext).
  # helm mode only — rejected in gitops mode (Argo CD owns the cluster target).
  - name: expectedKubeContext
    displayName: Substring esperada no kubectl context
    type: string
    default: ''

  # helm   → build + helm upgrade per ADO Environment (current path, kept as fallback).
  # gitops → build + push only; Kargo/Argo CD own promotion and deployment.
  - name: deliveryMode
    displayName: Entrega após o ECR (helm | gitops)
    type: string
    default: 'helm'
    values:
      - helm
      - gitops

stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Restore, Build and Test
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK ${{ parameters.dotnetVersion }}
            inputs:
              packageType: sdk
              version: ${{ parameters.dotnetVersion }}

          - ${{ each sdk in parameters.additionalSdkVersions }}:
            - task: UseDotNet@2
              displayName: Install .NET SDK ${{ sdk }}
              inputs:
                packageType: sdk
                version: ${{ sdk }}

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: ${{ parameters.solution }}

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-build --logger trx
              publishTestResults: true

          - ${{ if or(gt(length(parameters.deployEnvironments), 0), eq(parameters.deliveryMode, 'gitops')) }}:
            - task: Bash@3
              name: publishApp
              displayName: Publish app and resolve aspnet tag
              env:
                DOTNET_PROJECT: ${{ parameters.dotnetProject }}
                BUILD_CONFIGURATION: ${{ parameters.buildConfiguration }}
              inputs:
                targetType: inline
                script: |
                  set -Eeuo pipefail

                  if [[ -z "${DOTNET_PROJECT:-}" ]]; then
                    echo "##vso[task.logissue type=error]dotnetProject is required when an image is built (deployEnvironments set or deliveryMode: gitops)"
                    exit 1
                  fi

                  if [[ ! -f "${DOTNET_PROJECT}" ]]; then
                    echo "##vso[task.logissue type=error]dotnetProject not found: ${DOTNET_PROJECT}"
                    exit 1
                  fi

                  TFM="$(dotnet msbuild "${DOTNET_PROJECT}" -getProperty:TargetFramework -nologo 2>/dev/null | tr -d '\r' | tail -1 | tr -d '[:space:]')"
                  if [[ -z "${TFM}" || "${TFM}" == *"error"* ]]; then
                    TFMS="$(dotnet msbuild "${DOTNET_PROJECT}" -getProperty:TargetFrameworks -nologo 2>/dev/null | tr -d '\r' | tail -1 | tr -d '[:space:]')"
                    TFM="$(printf '%s\n' "${TFMS}" | tr ';' '\n' | grep -E '^net[0-9]' | head -1 || true)"
                  fi

                  if [[ ! "${TFM}" =~ ^net([0-9]+)\.([0-9]+)$ ]]; then
                    echo "##vso[task.logissue type=error]Could not resolve netN.M TargetFramework from ${DOTNET_PROJECT} via MSBuild (got: '${TFM:-}')"
                    exit 1
                  fi

                  ASPNET_TAG="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                  APP_DLL="$(basename "${DOTNET_PROJECT}" .csproj).dll"
                  PUBLISH_DIR="${BUILD_ARTIFACTSTAGINGDIRECTORY}/app"

                  echo "##[group]dotnet publish ${DOTNET_PROJECT} → ${PUBLISH_DIR}"
                  dotnet publish "${DOTNET_PROJECT}" \
                    --configuration "${BUILD_CONFIGURATION}" \
                    --no-build \
                    -o "${PUBLISH_DIR}"
                  echo "##[endgroup]"

                  if [[ ! -f "${PUBLISH_DIR}/${APP_DLL}" ]]; then
                    echo "##vso[task.logissue type=error]Published output missing ${APP_DLL} under ${PUBLISH_DIR}"
                    ls -la "${PUBLISH_DIR}" || true
                    exit 1
                  fi

                  echo "##vso[task.setvariable variable=aspnetTag;isOutput=true]${ASPNET_TAG}"
                  echo "##vso[task.setvariable variable=appDll;isOutput=true]${APP_DLL}"
                  echo "TFM=${TFM} aspnetTag=${ASPNET_TAG} appDll=${APP_DLL}"

            - task: PublishPipelineArtifact@1
              displayName: Publish app artifact
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)/app
                artifact: app

  - ${{ if and(eq(parameters.deliveryMode, 'helm'), gt(length(parameters.deployEnvironments), 3)) }}:
    - stage: DeployEnvironmentsOverflow
      displayName: Too many deployEnvironments
      dependsOn: CI
      jobs:
        - job: Fail
          pool:
            vmImage: ${{ parameters.vmImage }}
          steps:
            - bash: |
                echo "##vso[task.logissue type=error]At most 3 deployEnvironments are supported (develop→homolog→production). Extra entries would be silently ignored."
                exit 1
              displayName: Fail on overflow

  - ${{ if and(eq(parameters.deliveryMode, 'helm'), gt(length(parameters.deployEnvironments), 0), le(length(parameters.deployEnvironments), 3)) }}:
    - stage: DeployContract
      displayName: Validate deploy manifests
      dependsOn:
        - CI
      condition: succeeded()
      jobs:
        - job: CrossEnvIdentity
          displayName: Cross-env kind / workload.type
          pool:
            vmImage: ${{ parameters.vmImage }}
          steps:
            - checkout: self
              path: app
            - checkout: templates
              path: pipeline-templates
            - bash: |
                set -Eeuo pipefail
                WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                APP_DIR="${WORKSPACE}/app"
                TEMPLATES_DIR="${WORKSPACE}/pipeline-templates"
                CONFIG="${APP_DIR}/${{ parameters.runtimeConfigPath }}"
                PLATFORM_ENVS="${TEMPLATES_DIR}/config/platform-environments.json"
                YQ_VERSION="v4.44.3"
                PYYAML_VERSION="6.0.2"
                JSONSCHEMA_VERSION="4.23.0"

                if ! command -v yq >/dev/null 2>&1; then
                  echo "Installing pinned yq ${YQ_VERSION} (Microsoft-hosted)"
                  sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
                  sudo chmod +x /usr/local/bin/yq
                fi
                yq --version

                mapfile -t ENVS < <(printf '%s' "${DEPLOY_ENVIRONMENTS_JSON}" | yq -r '.[].name')
                if [[ "${#ENVS[@]}" -eq 0 ]]; then
                  echo "##vso[task.logissue type=error]deployEnvironments produced an empty name list"
                  exit 1
                fi
                if [[ "${#ENVS[@]}" -gt 3 ]]; then
                  echo "##vso[task.logissue type=error]At most 3 deployEnvironments supported (got ${#ENVS[@]}) — extra envs would be silently ignored"
                  exit 1
                fi

                # Duplicates
                uniq_count="$(printf '%s\n' "${ENVS[@]}" | sort -u | wc -l | tr -d ' ')"
                if [[ "${uniq_count}" -ne "${#ENVS[@]}" ]]; then
                  echo "##vso[task.logissue type=error]Duplicate environment names in deployEnvironments"
                  exit 1
                fi

                # Canonical order: develop → homolog → production (subset OK, never inverted)
                declare -A RANK=([develop]=1 [homolog]=2 [production]=3)
                prev=0
                for env in "${ENVS[@]}"; do
                  case "${env}" in
                    develop|homolog|production) ;;
                    *) echo "##vso[task.logissue type=error]Unsupported environment '${env}'"; exit 1 ;;
                  esac
                  r="${RANK[$env]}"
                  if (( r < prev )); then
                    echo "##vso[task.logissue type=error]deployEnvironments order must follow develop→homolog→production (got inverted: ${ENVS[*]})"
                    exit 1
                  fi
                  prev=$r

                  pool="$(yq -r ".${env}.containerPool // \"null\"" "${PLATFORM_ENVS}")"
                  if [[ "${pool}" == "null" || -z "${pool}" ]]; then
                    echo "##vso[task.logissue type=error]EXTERNAL BLOCKER: no authoritative containerPool for '${env}' in config/platform-environments.json — fill mapping before deploying"
                    exit 1
                  fi
                  ctx="$(yq -r ".${env}.expectedKubeContext // \"null\"" "${PLATFORM_ENVS}")"
                  if [[ "${ctx}" == "null" || -z "${ctx}" ]]; then
                    echo "##[warning]EXTERNAL BLOCKER: expectedKubeContext for '${env}' not mapped — deploy will skip exact context assert until filled"
                  fi
                done
                echo "Environments OK: ${ENVS[*]}"

                pip3 install --user "pyyaml==${PYYAML_VERSION}" "jsonschema==${JSONSCHEMA_VERSION}" >/dev/null
                export PATH="${HOME}/.local/bin:${PATH}"

                bash "${TEMPLATES_DIR}/scripts/assert-deploy-identity.sh" "${CONFIG}" "${ENVS[@]}"
                for env in "${ENVS[@]}"; do
                  manifest="${CONFIG}/${env}.yaml"
                  kind="$(yq -r '.kind // ""' "${manifest}")"
                  case "${kind}" in
                    Application) schema="${TEMPLATES_DIR}/schemas/application.manifest.schema.json" ;;
                    ScheduledJob) schema="${TEMPLATES_DIR}/schemas/scheduled-job.manifest.schema.json" ;;
                    *) echo "##vso[task.logissue type=error]Unsupported kind ${kind}"; exit 1 ;;
                  esac
                  python3 "${TEMPLATES_DIR}/scripts/validate-manifest.py" "${schema}" "${manifest}"
                done
              displayName: Assert identity + public schemas + env guards
              env:
                DEPLOY_ENVIRONMENTS_JSON: ${{ convertToJson(parameters.deployEnvironments) }}

    - template: container-build.yml
      parameters:
        dependsOn:
          - CI
          - DeployContract
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ parameters.containerPool }}
        awsRegion: ${{ parameters.awsRegion }}

    - template: helm-deploy.yml
      parameters:
        environmentName: ${{ parameters.deployEnvironments[0].name }}
        variableGroups: ${{ parameters.deployEnvironments[0].variableGroups }}
        dependsOn:
          - Container
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ iif(eq(parameters.deployEnvironments[0].name, 'develop'), 'PG-AWS-EKS', iif(eq(parameters.deployEnvironments[0].name, 'homolog'), 'PG-AWS-EKS-HML', coalesce(parameters.deployEnvironments[0].containerPool, parameters.containerPool))) }}
        awsRegion: ${{ parameters.awsRegion }}
        helmTimeout: ${{ coalesce(parameters.deployEnvironments[0].helmTimeout, parameters.helmTimeout) }}
        runtimeConfigPath: ${{ parameters.runtimeConfigPath }}
        expectedKubeContext: ''
        ecrPullSecret: ${{ coalesce(variables['ECR_PULL_SECRET'], '') }}
        smokeScheduledJob: ${{ coalesce(parameters.deployEnvironments[0].smokeScheduledJob, false) }}

  - ${{ if and(eq(parameters.deliveryMode, 'helm'), gt(length(parameters.deployEnvironments), 1)) }}:
    - template: helm-deploy.yml
      parameters:
        environmentName: ${{ parameters.deployEnvironments[1].name }}
        variableGroups: ${{ parameters.deployEnvironments[1].variableGroups }}
        dependsOn:
          - Container
          - Deploy_${{ parameters.deployEnvironments[0].name }}
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ iif(eq(parameters.deployEnvironments[1].name, 'develop'), 'PG-AWS-EKS', iif(eq(parameters.deployEnvironments[1].name, 'homolog'), 'PG-AWS-EKS-HML', coalesce(parameters.deployEnvironments[1].containerPool, parameters.containerPool))) }}
        awsRegion: ${{ parameters.awsRegion }}
        helmTimeout: ${{ coalesce(parameters.deployEnvironments[1].helmTimeout, parameters.helmTimeout) }}
        runtimeConfigPath: ${{ parameters.runtimeConfigPath }}
        expectedKubeContext: ''
        ecrPullSecret: ${{ coalesce(variables['ECR_PULL_SECRET'], '') }}
        smokeScheduledJob: ${{ coalesce(parameters.deployEnvironments[1].smokeScheduledJob, false) }}

  - ${{ if and(eq(parameters.deliveryMode, 'helm'), gt(length(parameters.deployEnvironments), 2)) }}:
    - template: helm-deploy.yml
      parameters:
        environmentName: ${{ parameters.deployEnvironments[2].name }}
        variableGroups: ${{ parameters.deployEnvironments[2].variableGroups }}
        dependsOn:
          - Container
          - Deploy_${{ parameters.deployEnvironments[1].name }}
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ iif(eq(parameters.deployEnvironments[2].name, 'develop'), 'PG-AWS-EKS', iif(eq(parameters.deployEnvironments[2].name, 'homolog'), 'PG-AWS-EKS-HML', coalesce(parameters.deployEnvironments[2].containerPool, parameters.containerPool))) }}
        awsRegion: ${{ parameters.awsRegion }}
        helmTimeout: ${{ coalesce(parameters.deployEnvironments[2].helmTimeout, parameters.helmTimeout) }}
        runtimeConfigPath: ${{ parameters.runtimeConfigPath }}
        expectedKubeContext: ''
        ecrPullSecret: ${{ coalesce(variables['ECR_PULL_SECRET'], '') }}
        smokeScheduledJob: ${{ coalesce(parameters.deployEnvironments[2].smokeScheduledJob, false) }}

  # ── deliveryMode: gitops ────────────────────────────────────────────────────
  # CI → GitOpsContract → Container. Nada depois disso no Azure DevOps.
  # O desired state (values com image.digest) vive no repositório GitOps e é
  # escrito pelo Kargo; o Argo CD reconcilia. Nenhum stage aqui faz rebuild.
  - ${{ if eq(parameters.deliveryMode, 'gitops') }}:
    - stage: GitOpsContract
      displayName: Validate GitOps delivery contract
      dependsOn:
        - CI
      condition: succeeded()
      jobs:
        - job: AssertGitOpsContract
          displayName: Assert consumer chooses no infrastructure
          pool:
            vmImage: ${{ parameters.vmImage }}
          steps:
            - checkout: none
            - bash: |
                set -Eeuo pipefail
                FAILED=0

                fail() { echo "##vso[task.logissue type=error]$1"; FAILED=1; }

                [[ -n "${APPLICATION_NAME:-}" ]] || fail "applicationName is required (ECR repository = applicationName)"
                [[ -n "${DOTNET_PROJECT:-}" ]] || fail "dotnetProject is required (image content)"

                # In gitops mode the artifact lifecycle after ECR belongs to Kargo.
                # These are not ignored — they are rejected, so no one ships a pipeline
                # that silently keeps the old promotion semantics.
                if [[ "${DEPLOY_ENVIRONMENTS_JSON}" != "[]" ]]; then
                  fail "deployEnvironments must be empty with deliveryMode: gitops — environments are Kargo Stages, not ADO Environments"
                fi
                if [[ -n "${EXPECTED_KUBE_CONTEXT:-}" ]]; then
                  fail "expectedKubeContext must be empty with deliveryMode: gitops — Argo CD owns the cluster target"
                fi

                if [[ "${FAILED}" -ne 0 ]]; then
                  exit 1
                fi

                echo "##[group]gitops delivery contract"
                cat <<EOF
                applicationName : ${APPLICATION_NAME}
                ECR repository  : ${APPLICATION_NAME}
                image tag       : ${BUILD_SOURCEVERSION} (git SHA, ECR IMMUTABLE)
                handoff         : ECR digest → Kargo Warehouse → Freight → Stage develop → Stage homolog
                deployment      : Kargo writes image.digest to the GitOps repo; Argo CD reconciles charts/asa-application
                this pipeline   : does NOT deploy, does NOT promote, does NOT rebuild
                EOF
                echo "##[endgroup]"
              displayName: Assert gitops contract
              env:
                APPLICATION_NAME: ${{ parameters.applicationName }}
                DOTNET_PROJECT: ${{ parameters.dotnetProject }}
                EXPECTED_KUBE_CONTEXT: ${{ parameters.expectedKubeContext }}
                DEPLOY_ENVIRONMENTS_JSON: ${{ convertToJson(parameters.deployEnvironments) }}

    - template: container-build.yml
      parameters:
        dependsOn:
          - CI
          - GitOpsContract
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ parameters.containerPool }}
        awsRegion: ${{ parameters.awsRegion }}
