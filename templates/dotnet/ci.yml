# Template de CI para aplicações .NET 10 (restore → build → test → imagem ECR).
# Consumir via extends a partir de outro repositório.
parameters:
  - name: solution
    displayName: Caminho do .sln ou .csproj
    type: string
    default: '**/*.sln'

  - name: buildConfiguration
    displayName: Configuração de build
    type: string
    default: 'Release'

  - name: vmImage
    displayName: Imagem do agent Microsoft-hosted (stage CI)
    type: string
    default: 'ubuntu-latest'

  - name: dotnetVersion
    displayName: Versão do SDK .NET
    type: string
    default: '10.x'

  # SDKs extras (ex.: ['8.x']) quando o TFM dos testes é mais antigo que o SDK principal.
  # Preferir SDK (não só runtime) para incluir Microsoft.AspNetCore.App.
  - name: additionalSdkVersions
    displayName: SDKs .NET adicionais
    type: object
    default: []

  - name: buildImage
    displayName: Build e push da imagem Docker para o ECR
    type: boolean
    default: false

  - name: containerPool
    displayName: Agent pool com Docker + acesso ao ECR
    type: string
    default: 'PG-AWS-EKS'

  - name: awsAccountId
    displayName: Conta AWS do registry ECR
    type: string
    default: '448003890252'

  - name: awsRegion
    displayName: Região do ECR
    type: string
    default: 'us-east-1'

  - name: ecrRepository
    displayName: Nome do repositório ECR (ex. sample-api)
    type: string
    default: ''

  - name: dockerfile
    displayName: Caminho do Dockerfile
    type: string
    default: 'Dockerfile'

  - name: dockerContext
    displayName: Contexto do docker build
    type: string
    default: '.'

  - name: deployEnabled
    displayName: Deploy Helm no cluster (Rancher) via o mesmo agent pool
    type: boolean
    default: false

  - name: helmReleaseName
    displayName: Nome do release Helm
    type: string
    default: 'sample-api'

  - name: helmNamespace
    displayName: Namespace Kubernetes do release
    type: string
    default: 'proving-ground-app'

  - name: helmChartPath
    displayName: Caminho do chart no repo de templates
    type: string
    default: 'charts/app'

  - name: helmTimeout
    displayName: Timeout do helm upgrade --wait
    type: string
    default: '5m'

  - name: helmCreateNamespace
    displayName: Criar namespace se não existir
    type: boolean
    default: false

stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Restore, Build and Test
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK ${{ parameters.dotnetVersion }}
            inputs:
              packageType: sdk
              version: ${{ parameters.dotnetVersion }}

          - ${{ each sdk in parameters.additionalSdkVersions }}:
            - task: UseDotNet@2
              displayName: Install .NET SDK ${{ sdk }}
              inputs:
                packageType: sdk
                version: ${{ sdk }}

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: ${{ parameters.solution }}

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-build --logger trx
              publishTestResults: true

  - ${{ if eq(parameters.buildImage, true) }}:
    - stage: Container
      displayName: Docker Build and Push
      dependsOn: CI
      condition: succeeded()
      jobs:
        - job: DockerBuildPush
          displayName: Build and push image to ECR
          pool:
            name: ${{ parameters.containerPool }}
          steps:
            - checkout: self

            - task: Bash@3
              name: dockerBuildPush
              displayName: ECR login, buildctl build and push
              env:
                AWS_REGION: ${{ parameters.awsRegion }}
                AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                AWS_ACCOUNT_ID: ${{ parameters.awsAccountId }}
                ECR_REPOSITORY: ${{ parameters.ecrRepository }}
                DOCKERFILE: ${{ parameters.dockerfile }}
                DOCKER_CONTEXT: ${{ parameters.dockerContext }}
                IMAGE_TAG: $(Build.SourceVersion)
                # PG-AWS-EKS (tenv3) usa BuildKit sidecar + crane — sem Docker Engine.
                BUILDKIT_HOST: unix:///run/buildkit/buildkitd.sock
              inputs:
                targetType: inline
                script: |
                  set -Eeuo pipefail
                  cd "${BUILD_SOURCESDIRECTORY}"

                  export PATH="/opt/tenv3/container-build-tools/bin:${PATH}"

                  if [[ -z "${ECR_REPOSITORY:-}" ]]; then
                    echo "##vso[task.logissue type=error]ecrRepository is required when buildImage=true"
                    exit 1
                  fi

                  if [[ ! -f "${DOCKERFILE}" ]]; then
                    echo "##vso[task.logissue type=error]Dockerfile not found: ${DOCKERFILE}"
                    exit 1
                  fi

                  if ! command -v buildctl >/dev/null || ! command -v crane >/dev/null; then
                    echo "##vso[task.logissue type=error]buildctl/crane not found — pool ${{ parameters.containerPool }} must expose BuildKit tools"
                    exit 1
                  fi

                  echo "##[group]aws caller identity (ambient credentials on agent)"
                  aws sts get-caller-identity
                  echo "##[endgroup]"

                  REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  IMAGE_REF="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                  DOCKERFILE_DIR="$(cd "$(dirname "${DOCKERFILE}")" && pwd)"
                  DOCKERFILE_NAME="$(basename "${DOCKERFILE}")"

                  echo "##[group]ecr login ${REGISTRY}"
                  aws ecr get-login-password --region "${AWS_REGION}" \
                    | crane auth login "${REGISTRY}" -u AWS --password-stdin
                  echo "##[endgroup]"

                  echo "##[group]ensure ecr repository ${ECR_REPOSITORY}"
                  if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null 2>&1; then
                    aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null
                    echo "Created repository ${ECR_REPOSITORY}"
                  else
                    echo "Repository ${ECR_REPOSITORY} already exists"
                  fi
                  echo "##[endgroup]"

                  echo "##[group]buildctl build+push ${IMAGE_REF}"
                  buildctl build \
                    --frontend dockerfile.v0 \
                    --local context="${DOCKER_CONTEXT}" \
                    --local dockerfile="${DOCKERFILE_DIR}" \
                    --opt "filename=${DOCKERFILE_NAME}" \
                    --output "type=image,name=${IMAGE_REF},push=true"
                  echo "##[endgroup]"

                  IMAGE_REPOSITORY="${REGISTRY}/${ECR_REPOSITORY}"

                  echo "##vso[task.setvariable variable=imageRef;isOutput=true]${IMAGE_REF}"
                  echo "##vso[task.setvariable variable=imageTag;isOutput=true]${IMAGE_TAG}"
                  echo "##vso[task.setvariable variable=imageRepository;isOutput=true]${IMAGE_REPOSITORY}"
                  echo "Pushed ${IMAGE_REF}"

  - ${{ if and(eq(parameters.buildImage, true), eq(parameters.deployEnabled, true)) }}:
    - stage: Deploy
      displayName: Helm Deploy
      dependsOn: Container
      condition: succeeded()
      variables:
        imageRepository: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageRepository'] ]
        imageTag: $[ stageDependencies.Container.DockerBuildPush.outputs['dockerBuildPush.imageTag'] ]
      jobs:
        - job: HelmDeploy
          displayName: Helm upgrade
          pool:
            name: ${{ parameters.containerPool }}
          steps:
            - checkout: templates
              displayName: Checkout chart
              path: pipeline-templates

            - task: Bash@3
              displayName: helm upgrade --install
              env:
                HELM_RELEASE: ${{ parameters.helmReleaseName }}
                HELM_NAMESPACE: ${{ parameters.helmNamespace }}
                HELM_CHART_PATH: ${{ parameters.helmChartPath }}
                HELM_TIMEOUT: ${{ parameters.helmTimeout }}
                HELM_CREATE_NAMESPACE: ${{ parameters.helmCreateNamespace }}
                AWS_REGION: ${{ parameters.awsRegion }}
                AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                AWS_ACCOUNT_ID: ${{ parameters.awsAccountId }}
                IMAGE_REPOSITORY: $(imageRepository)
                IMAGE_TAG: $(imageTag)
              inputs:
                targetType: inline
                script: |
                  set -Eeuo pipefail

                  WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                  CHART_DIR="${WORKSPACE}/pipeline-templates/${HELM_CHART_PATH}"

                  if [[ ! -f "${CHART_DIR}/Chart.yaml" ]]; then
                    echo "##vso[task.logissue type=error]Chart not found: ${CHART_DIR}"
                    exit 1
                  fi

                  if [[ -z "${IMAGE_REPOSITORY:-}" || -z "${IMAGE_TAG:-}" ]]; then
                    echo "##vso[task.logissue type=error]imageRepository/imageTag missing from Container stage"
                    exit 1
                  fi

                  CREATE_NS_ARGS=()
                  if [[ "${HELM_CREATE_NAMESPACE}" == "True" || "${HELM_CREATE_NAMESPACE}" == "true" ]]; then
                    CREATE_NS_ARGS+=(--create-namespace)
                  fi

                  REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  PULL_SECRET="ecr-pull"

                  echo "##[group]ecr imagePullSecret (${PULL_SECRET})"
                  ECR_PASS="$(aws ecr get-login-password --region "${AWS_REGION}")"
                  kubectl -n "${HELM_NAMESPACE}" create secret docker-registry "${PULL_SECRET}" \
                    --docker-server="${REGISTRY}" \
                    --docker-username=AWS \
                    --docker-password="${ECR_PASS}" \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "##[endgroup]"

                  echo "##[group]helm upgrade ${HELM_RELEASE} → ${IMAGE_REPOSITORY}:${IMAGE_TAG}"
                  helm upgrade --install "${HELM_RELEASE}" "${CHART_DIR}" \
                    --namespace "${HELM_NAMESPACE}" \
                    "${CREATE_NS_ARGS[@]}" \
                    --set-string "image.repository=${IMAGE_REPOSITORY}" \
                    --set-string "image.tag=${IMAGE_TAG}" \
                    --set-string "imagePullSecrets[0].name=${PULL_SECRET}" \
                    --wait \
                    --timeout "${HELM_TIMEOUT}"
                  echo "##[endgroup]"

                  kubectl -n "${HELM_NAMESPACE}" get deploy,svc,pods -l "app=${HELM_RELEASE}" -o wide
