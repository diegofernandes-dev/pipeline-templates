# Template de CI/.NET → ECR → Helm (promução por Environments ADO).
# Consumir via extends a partir de outro repositório.
parameters:
  - name: solution
    displayName: Caminho do .sln ou .csproj
    type: string
    default: '**/*.sln'

  - name: buildConfiguration
    displayName: Configuração de build
    type: string
    default: 'Release'

  - name: vmImage
    displayName: Imagem do agent Microsoft-hosted (stage CI)
    type: string
    default: 'ubuntu-latest'

  - name: dotnetVersion
    displayName: Versão do SDK .NET
    type: string
    default: '10.x'

  # SDKs extras (ex.: ['8.x']) quando o TFM dos testes é mais antigo que o SDK principal.
  # Preferir SDK (não só runtime) para incluir Microsoft.AspNetCore.App.
  - name: additionalSdkVersions
    displayName: SDKs .NET adicionais
    type: object
    default: []

  # Identidade única da aplicação. Deriva: ECR repository, Helm release e namespace asa-<name>
  # (mesmo nome de namespace em cada cluster; sem sufixo de ambiente).
  - name: applicationName
    displayName: Nome da aplicação (identidade única)
    type: string
    default: ''

  # Lista ordenada de ambientes para promover a mesma imagem.
  # Ex.: [{ name: homolog, containerPool: PG-AWS-EKS-HML, variableGroups: [] }]
  # name ∈ { develop, homolog, production }.
  # containerPool (opcional): pool do Deploy desse ambiente; default = parâmetro containerPool.
  # App env overlay: deploy/config/<name>.yaml no repo da app (IRSA, WIF, HPA, config, externalSecret).
  # variableGroups: legado/opcional (não alimenta IRSA/WIF/config de app). Lista vazia ⇒ só CI se deployEnvironments vazio.
  - name: deployEnvironments
    displayName: Ambientes ADO (+ pool por ambiente)
    type: object
    default: []

  - name: containerPool
    displayName: Agent pool com Docker + acesso ao ECR
    type: string
    default: 'PG-AWS-EKS'

  - name: awsRegion
    displayName: Região do ECR
    type: string
    default: 'us-east-1'

  # Path do .csproj a publicar na imagem (obrigatório quando há Container).
  - name: dotnetProject
    displayName: Caminho do .csproj da aplicação
    type: string
    default: ''

  - name: helmTimeout
    displayName: Timeout do helm upgrade --wait
    type: string
    default: '5m'

  # Pasta no repo da app com overlays <environment>.yaml (default: deploy/config).
  # Cada manifesto deve declarar kind: Application | ScheduledJob.
  - name: runtimeConfigPath
    displayName: Caminho dos manifestos por ambiente
    type: string
    default: 'deploy/config'

  # Optional substring that must appear in kubectl current-context (per-env override via deployEnvironments[].expectedKubeContext).
  - name: expectedKubeContext
    displayName: Substring esperada no kubectl context
    type: string
    default: ''

stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Restore, Build and Test
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK ${{ parameters.dotnetVersion }}
            inputs:
              packageType: sdk
              version: ${{ parameters.dotnetVersion }}

          - ${{ each sdk in parameters.additionalSdkVersions }}:
            - task: UseDotNet@2
              displayName: Install .NET SDK ${{ sdk }}
              inputs:
                packageType: sdk
                version: ${{ sdk }}

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: ${{ parameters.solution }}

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: ${{ parameters.solution }}
              arguments: --configuration ${{ parameters.buildConfiguration }} --no-build --logger trx
              publishTestResults: true

          - ${{ if gt(length(parameters.deployEnvironments), 0) }}:
            - task: Bash@3
              name: publishApp
              displayName: Publish app and resolve aspnet tag
              env:
                DOTNET_PROJECT: ${{ parameters.dotnetProject }}
                BUILD_CONFIGURATION: ${{ parameters.buildConfiguration }}
              inputs:
                targetType: inline
                script: |
                  set -Eeuo pipefail

                  if [[ -z "${DOTNET_PROJECT:-}" ]]; then
                    echo "##vso[task.logissue type=error]dotnetProject is required when deployEnvironments is set"
                    exit 1
                  fi

                  if [[ ! -f "${DOTNET_PROJECT}" ]]; then
                    echo "##vso[task.logissue type=error]dotnetProject not found: ${DOTNET_PROJECT}"
                    exit 1
                  fi

                  TFM="$(dotnet msbuild "${DOTNET_PROJECT}" -getProperty:TargetFramework -nologo 2>/dev/null | tr -d '\r' | tail -1 | tr -d '[:space:]')"
                  if [[ -z "${TFM}" || "${TFM}" == *"error"* ]]; then
                    TFMS="$(dotnet msbuild "${DOTNET_PROJECT}" -getProperty:TargetFrameworks -nologo 2>/dev/null | tr -d '\r' | tail -1 | tr -d '[:space:]')"
                    TFM="$(printf '%s\n' "${TFMS}" | tr ';' '\n' | grep -E '^net[0-9]' | head -1 || true)"
                  fi

                  if [[ ! "${TFM}" =~ ^net([0-9]+)\.([0-9]+)$ ]]; then
                    echo "##vso[task.logissue type=error]Could not resolve netN.M TargetFramework from ${DOTNET_PROJECT} via MSBuild (got: '${TFM:-}')"
                    exit 1
                  fi

                  ASPNET_TAG="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                  APP_DLL="$(basename "${DOTNET_PROJECT}" .csproj).dll"
                  PUBLISH_DIR="${BUILD_ARTIFACTSTAGINGDIRECTORY}/app"

                  echo "##[group]dotnet publish ${DOTNET_PROJECT} → ${PUBLISH_DIR}"
                  dotnet publish "${DOTNET_PROJECT}" \
                    --configuration "${BUILD_CONFIGURATION}" \
                    --no-build \
                    -o "${PUBLISH_DIR}"
                  echo "##[endgroup]"

                  if [[ ! -f "${PUBLISH_DIR}/${APP_DLL}" ]]; then
                    echo "##vso[task.logissue type=error]Published output missing ${APP_DLL} under ${PUBLISH_DIR}"
                    ls -la "${PUBLISH_DIR}" || true
                    exit 1
                  fi

                  echo "##vso[task.setvariable variable=aspnetTag;isOutput=true]${ASPNET_TAG}"
                  echo "##vso[task.setvariable variable=appDll;isOutput=true]${APP_DLL}"
                  echo "TFM=${TFM} aspnetTag=${ASPNET_TAG} appDll=${APP_DLL}"

            - task: PublishPipelineArtifact@1
              displayName: Publish app artifact
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)/app
                artifact: app

  - ${{ if gt(length(parameters.deployEnvironments), 0) }}:
    - stage: Container
      displayName: Docker Build and Push
      dependsOn: CI
      condition: succeeded()
      variables:
        aspnetTag: $[stageDependencies.CI.BuildAndTest.outputs['publishApp.aspnetTag']]
        appDll: $[stageDependencies.CI.BuildAndTest.outputs['publishApp.appDll']]
      jobs:
        - job: DockerBuildPush
          displayName: Build and push image to ECR
          pool:
            name: ${{ parameters.containerPool }}
          steps:
            - checkout: templates
              displayName: Checkout platform Dockerfile
              path: pipeline-templates

            - task: DownloadPipelineArtifact@2
              displayName: Download app artifact
              inputs:
                artifact: app
                path: $(Pipeline.Workspace)/app

            - task: Bash@3
              name: dockerBuildPush
              displayName: ECR login, buildctl build and push
              env:
                AWS_REGION: ${{ parameters.awsRegion }}
                AWS_DEFAULT_REGION: ${{ parameters.awsRegion }}
                APPLICATION_NAME: ${{ parameters.applicationName }}
                ASPNET_TAG: $(aspnetTag)
                APP_DLL: $(appDll)
                IMAGE_TAG: $(Build.SourceVersion)
                # PG-AWS-EKS (tenv3) usa BuildKit sidecar + crane — sem Docker Engine.
                BUILDKIT_HOST: unix:///run/buildkit/buildkitd.sock
              inputs:
                targetType: inline
                script: |
                  set -Eeuo pipefail

                  export PATH="/opt/tenv3/container-build-tools/bin:${PATH}"

                  if [[ -z "${APPLICATION_NAME:-}" ]]; then
                    echo "##vso[task.logissue type=error]applicationName is required when deployEnvironments is set"
                    exit 1
                  fi

                  if [[ -z "${ASPNET_TAG:-}" ]]; then
                    echo "##vso[task.logissue type=error]aspnetTag missing from CI outputs"
                    exit 1
                  fi

                  if [[ -z "${APP_DLL:-}" ]]; then
                    echo "##vso[task.logissue type=error]appDll missing from CI outputs"
                    exit 1
                  fi

                  WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                  APP_CONTEXT="${WORKSPACE}/app"
                  if [[ ! -f "${APP_CONTEXT}/${APP_DLL}" ]]; then
                    echo "##vso[task.logissue type=error]Published DLL not found: ${APP_CONTEXT}/${APP_DLL}"
                    ls -la "${APP_CONTEXT}" || true
                    exit 1
                  fi

                  DOCKERFILE_DIR="${WORKSPACE}/pipeline-templates/docker/dotnet"
                  if [[ ! -f "${DOCKERFILE_DIR}/Dockerfile" ]]; then
                    echo "##vso[task.logissue type=error]Platform Dockerfile not found: ${DOCKERFILE_DIR}/Dockerfile"
                    exit 1
                  fi

                  RUNTIME_IMAGE="mcr.microsoft.com/dotnet/aspnet:${ASPNET_TAG}"
                  ECR_REPOSITORY="${APPLICATION_NAME}"

                  if ! command -v buildctl >/dev/null || ! command -v crane >/dev/null; then
                    echo "##vso[task.logissue type=error]buildctl/crane not found — pool ${{ parameters.containerPool }} must expose BuildKit tools"
                    exit 1
                  fi

                  echo "##[group]aws caller identity (ambient credentials on agent)"
                  aws sts get-caller-identity
                  AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
                  echo "##[endgroup]"

                  if [[ -z "${AWS_ACCOUNT_ID}" || "${AWS_ACCOUNT_ID}" == "None" ]]; then
                    echo "##vso[task.logissue type=error]Could not resolve AWS account id from sts (agent ambient credentials)"
                    exit 1
                  fi

                  REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  IMAGE_REF="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

                  echo "##[group]ecr login ${REGISTRY}"
                  aws ecr get-login-password --region "${AWS_REGION}" \
                    | crane auth login "${REGISTRY}" -u AWS --password-stdin
                  echo "##[endgroup]"

                  echo "##[group]ensure ecr repository ${ECR_REPOSITORY}"
                  if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null 2>&1; then
                    aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null
                    echo "Created repository ${ECR_REPOSITORY}"
                  else
                    echo "Repository ${ECR_REPOSITORY} already exists"
                  fi
                  echo "##[endgroup]"

                  IMAGE_REPOSITORY="${REGISTRY}/${ECR_REPOSITORY}"

                  # Commit SHA tags + ECR IMMUTABLE: re-runs of the same commit must reuse, not overwrite.
                  if EXISTING_DIGEST="$(crane digest "${IMAGE_REF}" 2>/dev/null)"; then
                    echo "Image ${IMAGE_REF} already exists (${EXISTING_DIGEST}) — skipping build/push (immutable tag)"
                  else
                    echo "##[group]buildctl build+push ${IMAGE_REF} (RUNTIME_IMAGE=${RUNTIME_IMAGE} APP_DLL=${APP_DLL})"
                    buildctl build \
                      --frontend dockerfile.v0 \
                      --local context="${APP_CONTEXT}" \
                      --local dockerfile="${DOCKERFILE_DIR}" \
                      --opt filename=Dockerfile \
                      --opt "build-arg:RUNTIME_IMAGE=${RUNTIME_IMAGE}" \
                      --opt "build-arg:APP_DLL=${APP_DLL}" \
                      --opt platform=linux/amd64 \
                      --output "type=image,name=${IMAGE_REF},push=true"
                    echo "##[endgroup]"
                    echo "Pushed ${IMAGE_REF}"
                  fi

                  echo "##vso[task.setvariable variable=imageRef;isOutput=true]${IMAGE_REF}"
                  echo "##vso[task.setvariable variable=imageTag;isOutput=true]${IMAGE_TAG}"
                  echo "##vso[task.setvariable variable=imageRepository;isOutput=true]${IMAGE_REPOSITORY}"

  - ${{ if gt(length(parameters.deployEnvironments), 0) }}:
    - stage: DeployContract
      displayName: Validate deploy manifests
      dependsOn:
        - Container
      jobs:
        - job: CrossEnvIdentity
          displayName: Cross-env kind / workload.type
          pool:
            vmImage: ${{ parameters.vmImage }}
          steps:
            - checkout: self
              path: app
            - checkout: templates
              path: pipeline-templates
            - bash: |
                set -Eeuo pipefail
                WORKSPACE="${PIPELINE_WORKSPACE:-${AGENT_BUILDDIRECTORY}}"
                APP_DIR="${WORKSPACE}/app"
                TEMPLATES_DIR="${WORKSPACE}/pipeline-templates"
                CONFIG="${APP_DIR}/${{ parameters.runtimeConfigPath }}"
                ENVS=(
                ${{ each env in parameters.deployEnvironments }}
                  ${{ env.name }}
                ${{ end }}
                )
                if ! command -v yq >/dev/null 2>&1; then
                  sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
                  sudo chmod +x /usr/local/bin/yq
                fi
                bash "${TEMPLATES_DIR}/scripts/assert-deploy-identity.sh" "${CONFIG}" "${ENVS[@]}"
                for env in "${ENVS[@]}"; do
                  manifest="${CONFIG}/${env}.yaml"
                  kind="$(yq -r '.kind // ""' "${manifest}")"
                  case "${kind}" in
                    Application) schema="${TEMPLATES_DIR}/schemas/application.manifest.schema.json" ;;
                    ScheduledJob) schema="${TEMPLATES_DIR}/schemas/scheduled-job.manifest.schema.json" ;;
                    *) echo "##vso[task.logissue type=error]Unsupported kind ${kind}"; exit 1 ;;
                  esac
                  if ! python3 -c 'import yaml' >/dev/null 2>&1; then
                    pip3 install --user pyyaml >/dev/null
                  fi
                  python3 "${TEMPLATES_DIR}/scripts/validate-manifest.py" "${schema}" "${manifest}"
                done
              displayName: Assert identity + public schemas

    - template: helm-deploy.yml
      parameters:
        environmentName: ${{ parameters.deployEnvironments[0].name }}
        variableGroups: ${{ parameters.deployEnvironments[0].variableGroups }}
        dependsOn:
          - Container
          - DeployContract
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ coalesce(parameters.deployEnvironments[0].containerPool, parameters.containerPool) }}
        awsRegion: ${{ parameters.awsRegion }}
        helmTimeout: ${{ coalesce(parameters.deployEnvironments[0].helmTimeout, parameters.helmTimeout) }}
        runtimeConfigPath: ${{ parameters.runtimeConfigPath }}
        expectedKubeContext: ${{ coalesce(parameters.deployEnvironments[0].expectedKubeContext, parameters.expectedKubeContext) }}
        smokeScheduledJob: false

  - ${{ if gt(length(parameters.deployEnvironments), 1) }}:
    - template: helm-deploy.yml
      parameters:
        environmentName: ${{ parameters.deployEnvironments[1].name }}
        variableGroups: ${{ parameters.deployEnvironments[1].variableGroups }}
        dependsOn:
          - Container
          - DeployContract
          - Deploy_${{ parameters.deployEnvironments[0].name }}
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ coalesce(parameters.deployEnvironments[1].containerPool, parameters.containerPool) }}
        awsRegion: ${{ parameters.awsRegion }}
        helmTimeout: ${{ coalesce(parameters.deployEnvironments[1].helmTimeout, parameters.helmTimeout) }}
        runtimeConfigPath: ${{ parameters.runtimeConfigPath }}
        expectedKubeContext: ${{ coalesce(parameters.deployEnvironments[1].expectedKubeContext, parameters.expectedKubeContext) }}
        smokeScheduledJob: false

  - ${{ if gt(length(parameters.deployEnvironments), 2) }}:
    - template: helm-deploy.yml
      parameters:
        environmentName: ${{ parameters.deployEnvironments[2].name }}
        variableGroups: ${{ parameters.deployEnvironments[2].variableGroups }}
        dependsOn:
          - Container
          - DeployContract
          - Deploy_${{ parameters.deployEnvironments[1].name }}
        applicationName: ${{ parameters.applicationName }}
        containerPool: ${{ coalesce(parameters.deployEnvironments[2].containerPool, parameters.containerPool) }}
        awsRegion: ${{ parameters.awsRegion }}
        helmTimeout: ${{ coalesce(parameters.deployEnvironments[2].helmTimeout, parameters.helmTimeout) }}
        runtimeConfigPath: ${{ parameters.runtimeConfigPath }}
        expectedKubeContext: ${{ coalesce(parameters.deployEnvironments[2].expectedKubeContext, parameters.expectedKubeContext) }}
        smokeScheduledJob: false
