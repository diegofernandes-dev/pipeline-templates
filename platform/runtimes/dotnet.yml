# Runtime profile: dotnet
# Injected by the .NET pipeline as Helm values (chart:) before the consumer manifesto.
# reservedConfig is enforced by DeployContract — not by the chart (charts stay runtime-agnostic).
#
# Values match chart defaults today so enabling the profile is a no-op for render shape
# (aside from the runtime-agnostic env contract the chart already emits).
chart:
  probeDefaults:
    startup:
      failureThreshold: 30
      periodSeconds: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 512Mi
  tmp:
    sizeLimit: 128Mi
  terminationGracePeriodSeconds: 30
  shutdownTimeoutSeconds: 25

reservedConfig:
  exact:
    - ASPNETCORE_URLS
    - ASPNETCORE_HTTP_PORTS
    - ASPNETCORE_HTTPS_PORTS
  prefixes:
    - Kestrel__
